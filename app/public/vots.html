<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #000000; overflow: hidden; }
      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; flex-direction: column; }
    </style>
    <script>
      try {
        document.documentElement.style.setProperty('--bg-main', '#000000');
        document.documentElement.style.backgroundColor = '#000000';
      } catch (e) {}
    </script>
    <meta name="description" content="Matey — My-VOTS private link journaling." />
    <link rel="icon" href="./images/matey-logo.png" type="image/png" />
    <meta name="theme-color" content="#000000" />
    <title>Matey - My-VOTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script src="./matey-boot.js?v=101"></script>
    <script src="./matey-sentry.js?v=101"></script>

<body>
       <div class="app-shell">
      <header class="header">
        <div class="header-left">
          <img src="images/matey-logo.png" class="matey-logo" alt="Matey" />
          <button id="workspace-folder-btn" class="header-icon-btn workspace-plug-box" title="Select Workspace" aria-label="Select Workspace">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M9 9h6"></path><path d="M9 13h6"></path></svg>
          </button>
          <button class="header-icon-btn ide-text-badge" type="button" title="IDE" aria-label="IDE">IDE</button>
        </div>
        <div class="header-actions">
          <div class="status-circle" title="Token Meter"></div>
          <button class="header-icon-btn" type="button" title="Incognito" aria-label="Incognito">
            <svg viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M50 4 C20 4 5 28 5 52 L5 92 C5 105 15 105 20 98 C25 105 35 105 40 98 C45 105 55 105 60 98 C65 105 75 105 80 98 C85 105 95 105 95 92 L95 52 C95 28 80 4 50 4 Z"/>
              <ellipse cx="35" cy="50" rx="10" ry="15"/>
              <ellipse cx="65" cy="50" rx="10" ry="15"/>
              <path d="M26 34 L38 40"/>
              <path d="M74 34 L62 40"/>
              <path d="M38 78 Q50 94 62 78 Q50 88 38 78 Z"/>
              <path d="M40 80 L43 85 L46 80 L49 85 L52 80 L55 85 L58 80 L60 82"/>
            </svg>
          </button>
          <button class="header-icon-btn burger-menu-btn" type="button" title="Menu" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
          </button>
        </div>
      </header>
      <nav class="tabs-wrap" id="tabs-wrap">
          <div class="tabs">
            <a class="tab" href="./lifestyle.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></svg>
              <span>LIFESTYLE</span>
            </a>
            <a class="tab active" href="./vots.html" aria-current="page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span>MY VOTS</span>
            </a>
            <a class="tab" href="./journal.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>

      <main class="main-content vts-lock" id="vts-lock" style="display:none">
        <div class="vts-lock-content" style="background:var(--bg-card);border:1px solid var(--border-card);border-radius:16px;padding:32px 24px;max-width:360px;width:90%;">
          <div class="vts-lock-icon" style="margin-bottom:16px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <h2 class="vts-lock-title" style="font-size:20px;font-weight:600;color:var(--text-primary);margin:0 0 8px;">My-VOTS Locked</h2>
          <p class="vts-lock-desc" style="color:var(--text-muted);font-size:14px;margin:0 0 24px;">Enter your PIN or draw your pattern to unlock</p>

          <!-- PIN mode -->
          <div class="vts-lock-mode" id="vts-lock-mode-pin" style="display:none;display:flex;flex-direction:column;gap:12px;">
            <input type="password" class="vts-lock-input" id="vts-pin-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••••" maxlength="6" style="width:100%;background:var(--bg-main);border:1px solid var(--border-card);border-radius:12px;padding:16px;font:inherit;font-size:18px;color:var(--text-primary);text-align:center;letter-spacing:8px;outline:none;" />
            <button class="btn btn-primary btn-block btn-lg" id="vts-unlock-btn" type="button">Unlock</button>
            <button class="btn btn-secondary btn-block btn-lg" id="vts-setup-lock-btn" type="button" style="display:none;">Set Up PIN</button>
            <p class="vts-lock-error" id="vts-pin-error" style="display:none;color:var(--danger);font-size:13px;text-align:center;">Incorrect PIN</p>
          </div>

          <!-- Pattern mode -->
          <div class="vts-lock-mode" id="vts-lock-mode-pattern" style="display:none;display:flex;flex-direction:column;gap:12px;align-items:center;">
            <div id="vts-pattern-unlock-container"></div>
            <button class="btn btn-secondary btn-block btn-lg" id="vts-unlock-pattern-btn" type="button">Draw Pattern</button>
          </div>

          <!-- Setup mode (no lock configured) -->
          <div class="vts-lock-mode" id="vts-lock-mode-setup" style="display:none;display:flex;flex-direction:column;gap:12px;">
            <input type="password" class="vts-lock-input" id="vts-pin-input" inputmode="numeric" pattern="[0-9]*" placeholder="6-digit PIN" maxlength="6" style="width:100%;background:var(--bg-main);border:1px solid var(--border-card);border-radius:12px;padding:16px;font:inherit;font-size:18px;color:var(--text-primary);text-align:center;letter-spacing:8px;outline:none;" />
            <button class="btn btn-primary btn-block btn-lg" id="vts-setup-pin-btn" type="button">Set PIN</button>
            <button class="btn btn-secondary btn-block btn-lg" id="vts-setup-pattern-btn" type="button">Use Pattern Lock</button>
            <div id="vts-pattern-setup-container" style="margin-top:12px"></div>
          </div>
        </div>
      </main>

      <!-- ==================== LANDING / LINK GATE ==================== -->
      <main class="main-content vts-landing" id="vts-landing" style="display:none;background:#000000;display:flex;flex-direction:column;height:100%;">
        <div class="vts-link-gate" id="vts-link-gate" style="padding:24px 16px;">
          <div class="vts-link-field" style="display:flex;flex-direction:column;gap:12px;background:var(--bg-card);border:1px solid var(--border-card);border-radius:16px;padding:20px;">
            <input type="url" class="vts-link-input" id="vts-link-input" placeholder="https://x.com/user/status/12345 or https://youtube.com/watch?v=..." autocomplete="off" style="background:var(--bg-main);border:1px solid var(--border-card);border-radius:12px;padding:16px;font:inherit;font-size:15px;color:var(--text-primary);outline:none;" />
            <button class="btn btn-primary btn-block btn-lg" id="vts-link-submit" type="button">Start Entry</button>
          </div>
          <div class="vts-link-gate-desc" id="vts-link-helper" style="color:var(--text-muted);font-size:13px;text-align:center;margin-top:12px;">Paste a public link to respond to</div>
        </div>

        <!-- Entry History -->
        <div class="vts-history-section" id="vts-history-section" style="flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;">
          <div class="vts-history-header" style="padding:16px 0;">
            <h2 class="vts-history-title" style="font-size:18px;font-weight:600;color:var(--text-primary);margin:0;">Your Responses</h2>
          <div class="vts-history-list" id="vts-history-list" style="display:flex;flex-direction:column;gap:12px;"></div>
          <div class="vts-history-empty" id="vts-history-empty" style="text-align:center;padding:48px 24px;color:var(--text-muted);">No entries yet. Paste a link above to get started.</div>
        </div>
      </main>

      <!-- ==================== EDITOR ==================== -->
      <main class="main-content vts-editor" id="vts-editor" style="display:none;background:#000000;flex-direction:column;height:100%;">
        <div class="vts-editor-header" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border-card);background:#000000;position:sticky;top:0;z-index:10;">
          <button class="header-icon-btn" id="vts-back-to-landing" type="button" aria-label="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="btn btn-primary btn-sm" id="vts-save-entry-btn" type="button">Save</button>
        </div>

        <div class="vts-editor-scroll" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;">
          <!-- Link Card Preview -->
          <div class="vts-link-card" id="vts-link-card" style="display:none;background:var(--bg-card);border:1px solid var(--border-card);border-radius:12px;padding:16px;margin-bottom:16px;"></div>

          <!-- Headline Mini-Form -->
          <div class="vts-headline-form" style="display:flex;flex-direction:column;gap:16px;margin-bottom:16px;">
            <div class="vts-headline-field" style="display:flex;flex-direction:column;gap:8px;">
              <label class="vts-headline-label" style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;">Who / Source</label>
              <input type="text" class="vts-headline-input" id="vts-headline-who" placeholder="e.g. Elon Musk, The Verge..." style="background:var(--bg-main);border:1px solid var(--border-card);border-radius:12px;padding:16px;font:inherit;font-size:15px;color:var(--text-primary);outline:none;" />
            </div>
            <div class="vts-headline-field" style="display:flex;flex-direction:column;gap:8px;">
              <label class="vts-headline-label" style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;">Action Verb</label>
              <div class="vts-verb-chips" id="vts-verb-chips" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
            </div>
            <div class="vts-headline-field" style="display:flex;flex-direction:column;gap:8px;">
              <label class="vts-headline-label" style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;">About What</label>
              <input type="text" class="vts-headline-input" id="vts-headline-about" placeholder="e.g. the new AI model..." style="background:var(--bg-main);border:1px solid var(--border-card);border-radius:12px;padding:16px;font:inherit;font-size:15px;color:var(--text-primary);outline:none;" />
            </div>
          </div>

          <!-- Font selector toolbar (above the writing canvas) -->
          <div class="vts-font-bar" id="vts-font-bar" role="toolbar" aria-label="Font selector" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;"></div>

          <!-- Content Textarea -->
          <textarea class="vts-entry-content" id="vts-entry-content" placeholder="Your response..." rows="6" style="width:100%;min-height:200px;background:transparent;border:none;color:var(--text-primary);font:inherit;font-size:16px;line-height:1.6;resize:none;outline:none;"></textarea>

          <!-- Double-stack keyboard + mic toolbar (mirrors journal) -->
          <div id="vots-composer" class="vots-toolbar" style="margin-top:16px;"></div>
        </div>
      </main>

      <!-- ==================== CONFIRM DIALOG ==================== -->
      <div class="vts-confirm-overlay" id="vts-confirm" style="display:none">
        <div class="vts-confirm-box" style="background:var(--bg-card);border:1px solid var(--border-card);border-radius:16px;padding:24px;max-width:360px;width:90%;">
          <div class="vts-confirm-icon" style="font-size:32px;margin-bottom:12px;">⚠️</div>
          <div class="vts-confirm-title" id="vts-confirm-title" style="font-size:18px;font-weight:600;color:var(--text-primary);margin:0 0 8px;">Confirm</div>
          <div class="vts-confirm-desc" id="vts-confirm-desc" style="color:var(--text-muted);font-size:14px;margin:0 0 24px;"></div>
          <div class="vts-confirm-actions" style="display:flex;gap:12px;justify-content:flex-end;">
            <button class="vts-btn vts-btn-secondary" id="vts-confirm-cancel" type="button" style="background:transparent;color:var(--text-muted);border:1px solid var(--border-card);border-radius:12px;padding:12px 20px;font:inherit;font-size:14px;cursor:pointer;">Cancel</button>
            <button class="vts-btn vts-btn-danger" id="vts-confirm-ok" type="button" style="background:var(--danger);color:#FFFFFF;border:none;border-radius:12px;padding:12px 20px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;">Confirm</button>
          </div>
        </div>
      </div>

      <!-- ==================== TOAST ==================== -->
      <div class="vts-toast" id="vts-toast" style="display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-card);border:1px solid var(--border-card);color:var(--text-primary);padding:12px 24px;border-radius:9999px;font-size:13px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:200;opacity:0;pointer-events:none;transition:opacity 250ms cubic-bezier(0.16, 1, 0.3, 1),transform 250ms cubic-bezier(0.34, 1.56, 0.64, 1);">
        <span id="vts-toast-text"></span>
      </div>

      </div>
    </div>

    <script>
      /* Font selector toolbar — same font set as the Journal editor.
         Applies the chosen family to the writing canvas and persists it. */
      (function () {
        'use strict';
        var FONTS = [
          { name: 'Inter', family: "'Inter', sans-serif" },
          { name: 'Space Grotesk', family: "'Space Grotesk', sans-serif" },
          { name: 'DM Sans', family: "'DM Sans', sans-serif" },
          { name: 'Outfit', family: "'Outfit', sans-serif" }
        ];
        var KEY = 'matey-vots-font';
        var bar = document.getElementById('vts-font-bar');
        var canvas = document.getElementById('vts-entry-content');
        if (!bar || !canvas) return;
        var saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }
        if (saved) canvas.style.fontFamily = saved;
        FONTS.forEach(function (f) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'vts-font-btn' + (saved === f.family ? ' active' : '');
          btn.style.fontFamily = f.family;
          btn.textContent = f.name;
          btn.title = 'Set editor font: ' + f.name;
          btn.addEventListener('click', function () {
            canvas.style.fontFamily = f.family;
            try { localStorage.setItem(KEY, f.family); } catch (e) {}
            Array.prototype.forEach.call(bar.children, function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
          });
          bar.appendChild(btn);
        });
      })();
    </script>
    <script>
    (function() {
      /* Logo -> home */
      var logo = document.querySelector(".matey-logo");
      if (logo && !logo._wired) {
        logo._wired = true;
        logo.style.cursor = "pointer";
        logo.addEventListener("click", function() {
          window.location.href = "./index.html";
        });
      }

      /* Workspace folder -> open picker */
      var folderBtn = document.querySelector(".workspace-folder-btn");
      if (folderBtn && !folderBtn._wired) {
        folderBtn._wired = true;
        folderBtn.addEventListener("click", function(e) {
          e.preventDefault();
          if (window.MateyFS && MateyFS.selectWorkspace) {
            MateyFS.selectWorkspace();
          }
        });
      }

      /* IDE badge -> focus editor if present */
      var ideBadge = document.querySelector(".ide-text-badge");
      if (ideBadge && !ideBadge._wired) {
        ideBadge._wired = true;
        ideBadge.addEventListener("click", function() {
          var editor = document.querySelector("#edit-editor-container, #md-ide-container");
          if (editor) {
            editor.scrollIntoView({ behavior: "smooth", block: "center" });
          } else {
            alert("IDE mode active on this screen");
          }
        });
      }

      /* Status circle -> toggle usage demo */
      var statusCircle = document.querySelector(".status-circle");
      if (statusCircle && !statusCircle._wired) {
        statusCircle._wired = true;
        var usageOn = true;
        statusCircle.addEventListener("click", function() {
          usageOn = !usageOn;
          if (window.MateyUsage && MateyUsage.update) {
            MateyUsage.update(usageOn ? 100 : 0);
          }
          statusCircle.style.opacity = usageOn ? "1" : "0.5";
        });
      }

      /* Burger menu -> toggle settings overlay if present */
      var burgerBtns = document.querySelectorAll(".burger-menu-btn");
      burgerBtns.forEach(function(btn) {
        if (btn._wired) return;
        btn._wired = true;
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          var settings = document.getElementById("settings");
          if (settings) {
            var willOpen = !settings.classList.contains("open");
            settings.classList[willOpen ? "add" : "remove"]("open");
            if (willOpen && window.MateyThemes && MateyThemes.build) {
              MateyThemes.build(settings);
            }
          } else {
            alert("Menu tapped");
          }
        });
      });
    })();
  </script>
