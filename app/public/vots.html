<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text-primary); overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif; }
      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; flex-direction: column; }
    </style>
    <script>
      try {
        var _bgs = { graphitexx: '#000000', 'cool-panda': '#1a1d23', minimal: '#fafafa' };
        var _t = localStorage.getItem('matey-theme') || 'graphitexx';
        var _bg = _bgs[_t] || _bgs.graphitexx;
        document.documentElement.style.setProperty('--app-bg', _bg);
        document.documentElement.style.backgroundColor = _bg;
      } catch (e) {}
    </script>
    <meta name="description" content="Matey — My-VOTS private link journaling." />
    <link rel="icon" href="./images/matey-logo.png" type="image/png" />
    <meta name="theme-color" content="#000000" />
    <title>Matey - My-VOTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="./version.js"></script>
    <script>
      document.write('<link rel="stylesheet" href="./matey-preview.css?v=' + MATEY_CSS_VERSION + '">');
    </script>
    <link rel="stylesheet" href="theme.css?v=105">
    <script src="./matey-boot.js?v=101"></script>
    <script src="./matey-sentry.js?v=101"></script>
  </head>
<body>
    <div class="app-shell">
      <header class="header">
        <!-- LEFT GROUP -->
        <div class="header-left">
          <img src="images/matey-logo.png" class="matey-logo" alt="Logo" />
          <button id="workspace-folder-btn" class="workspace-folder-btn" title="Select Workspace">📁</button>
          <div class="id-icon" title="ID Badge">🪪</div>
        </div>

        <!-- RIGHT GROUP -->
        <div class="header-actions">
          <div class="usage-ring" title="Token Meter"></div>
          <button id="lux-theme-toggle" class="theme-toggle-btn" title="Theme Palette">🎨</button>
          <div id="vault-launcher" class="vault-btn" title="Storage Vault">🗄️</div>
          <div class="incognito-trigger" title="Incognito">👻</div>
          <button class="menu-btn" title="Menu">☰</button>
        </div>
      </header>

      <nav class="tabs-wrap" id="tabs-wrap">
        <div class="tabs">
          <a class="tab" href="./lifestyle.html">Lifestyle</a>
          <a class="tab active" href="./vots.html">My-VOTS</a>
          <a class="tab" href="./raw-editor.html">&gt;edit</a>
          <a class="tab" href="./journal.html">Journal</a>
          <a class="tab" href="./preview.html#agent">&gt;agent</a>
        </div>
      </nav>
      <div class="tab-border" style="height:1px;background:var(--border-card);width:100%"></div>

      <!-- ==================== LOCK SCREEN ==================== -->
      <main class="vts-lock" id="vts-lock" style="display:none">
        <div class="vts-lock-content">
          <div class="vts-lock-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <h2 class="vts-lock-title">My-VOTS Locked</h2>
          <p class="vts-lock-desc">Enter your PIN or draw your pattern to unlock</p>

          <!-- PIN mode -->
          <div class="vts-lock-mode" id="vts-lock-mode-pin" style="display:none">
            <input type="password" class="vts-lock-input" id="vts-pin-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••••" maxlength="6" />
            <button class="vts-btn vts-btn-primary" id="vts-unlock-btn" type="button">Unlock</button>
            <button class="vts-btn vts-btn-secondary" id="vts-setup-lock-btn" type="button" style="display:none">Set Up PIN</button>
            <p class="vts-lock-error" id="vts-pin-error" style="display:none">Incorrect PIN</p>
          </div>

          <!-- Pattern mode -->
          <div class="vts-lock-mode" id="vts-lock-mode-pattern" style="display:none">
            <div id="vts-pattern-unlock-container"></div>
            <button class="vts-btn vts-btn-secondary" id="vts-unlock-pattern-btn" type="button">Draw Pattern</button>
          </div>

          <!-- Setup mode (no lock configured) -->
          <div class="vts-lock-mode" id="vts-lock-mode-setup" style="display:none">
            <input type="password" class="vts-lock-input" id="vts-pin-input" inputmode="numeric" pattern="[0-9]*" placeholder="6-digit PIN" maxlength="6" />
            <button class="vts-btn vts-btn-primary" id="vts-setup-pin-btn" type="button">Set PIN</button>
            <button class="vts-btn vts-btn-secondary" id="vts-setup-pattern-btn" type="button">Use Pattern Lock</button>
            <div id="vts-pattern-setup-container" style="margin-top:12px"></div>
          </div>
        </div>
      </main>

      <!-- ==================== LANDING / LINK GATE ==================== -->
      <main class="vts-landing" id="vts-landing" style="display:none">
        <div class="vts-link-gate" id="vts-link-gate">
          <div class="vts-link-field">
            <input type="url" class="vts-link-input" id="vts-link-input" placeholder="https://x.com/user/status/12345 or https://youtube.com/watch?v=..." autocomplete="off" />
            <button class="vts-link-submit" id="vts-link-submit" type="button">Start Entry</button>
          </div>
          <div class="vts-link-gate-desc" id="vts-link-helper">Paste a public link to respond to</div>
        </div>

        <!-- Entry History -->
        <div class="vts-history-section" id="vts-history-section">
          <div class="vts-history-header">
            <h2 class="vts-history-title">Your Responses</h2>
          <div class="vts-history-list" id="vts-history-list"></div>
          <div class="vts-history-empty" id="vts-history-empty">No entries yet. Paste a link above to get started.</div>
        </div>
      </main>

      <!-- ==================== EDITOR ==================== -->
      <main class="vts-editor" id="vts-editor" style="display:none">
        <div class="vts-editor-header">
          <button class="vts-icon-btn" id="vts-back-to-landing" type="button" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="vts-btn vts-btn-primary" id="vts-save-entry-btn" type="button" style="margin-left:auto">Save</button>
        </div>

        <div class="vts-editor-scroll">
          <!-- Link Card Preview -->
          <div class="vts-link-card" id="vts-link-card" style="display:none"></div>

          <!-- Headline Mini-Form -->
          <div class="vts-headline-form">
            <div class="vts-headline-field">
              <label class="vts-headline-label">Who / Source</label>
              <input type="text" class="vts-headline-input" id="vts-headline-who" placeholder="e.g. Elon Musk, The Verge..." />
            </div>
            <div class="vts-headline-field">
              <label class="vts-headline-label">Action Verb</label>
              <div class="vts-verb-chips" id="vts-verb-chips"></div>
            </div>
            <div class="vts-headline-field">
              <label class="vts-headline-label">About What</label>
              <input type="text" class="vts-headline-input" id="vts-headline-about" placeholder="e.g. the new AI model..." />
            </div>
          </div>

          <!-- Font selector toolbar (above the writing canvas) -->
          <div class="vts-font-bar" id="vts-font-bar" role="toolbar" aria-label="Font selector"></div>

          <!-- Content Textarea -->
          <textarea class="vts-entry-content" id="vts-entry-content" placeholder="Your response..." rows="6"></textarea>

          <!-- Double-stack keyboard + mic toolbar (mirrors journal) -->
          <div id="vots-composer" class="vots-toolbar"></div>
        </div>
      </main>

      <!-- ==================== CONFIRM DIALOG ==================== -->
      <div class="vts-confirm-overlay" id="vts-confirm" style="display:none">
        <div class="vts-confirm-box">
          <div class="vts-confirm-icon">⚠️</div>
          <div class="vts-confirm-title" id="vts-confirm-title">Confirm</div>
          <div class="vts-confirm-desc" id="vts-confirm-desc"></div>
          <div class="vts-confirm-actions">
            <button class="vts-btn vts-btn-secondary" id="vts-confirm-cancel" type="button">Cancel</button>
            <button class="vts-btn vts-btn-danger" id="vts-confirm-ok" type="button">Confirm</button>
          </div>
        </div>
      </div>

      <!-- ==================== TOAST ==================== -->
      <div class="vts-toast" id="vts-toast" style="display:none">
        <span id="vts-toast-text"></span>
      </div>

    </div>

    <script src="./matey-themes.js?v=101"></script>
    <script src="./matey-theme-toggle.js?v=101"></script>
    <script src="./matey-swipe.js?v=101"></script>
    <script src="./matey-profile.js?v=101"></script>
    <script src="./matey-greet.js?v=101"></script>
    <script src="./matey-feed.js?v=101"></script>
    <script src="./matey-ai.js?v=101"></script>
    <script src="./matey-md.js?v=101"></script>
    <script src="./matey-byok.js?v=101"></script>
    <script src="./matey-agent-harness.js?v=101"></script>
    <script src="./matey-beat.js?v=101"></script>
    <script src="./matey-lifestyle.js?v=101"></script>
    <script src="./matey-syntax.js?v=101"></script>
    <script src="./matey-whisper.js?v=101"></script>
    <script src="./matey-stt.js?v=101"></script>
    <script src="./matey-models.js?v=101"></script>
    <script src="./matey-rss.js?v=101"></script>
    <script src="./matey-license.js?v=101"></script>
    <script src="./matey-settings.js?v=101"></script>
    <script src="./matey-recall.js?v=101"></script>
    <script type="module">import { mateyCoach } from './matey-coach.js'; window.mateyCoach = mateyCoach;</script>
    <script src="./matey-init.js?v=101"></script>
    <script src="./matey-tabs.js?v=101"></script>
    <script src="./matey-keyboard.js?v=101"></script>
    <script src="./matey-mic.js?v=101"></script>
    <script src="./matey-toolbar.js?v=101"></script>
    <script src="./matey-fs.js?v=101"></script>
    <script type="module" src="./matey-shadow-twin.js"></script>
    <script src="./matey-hooks-manager.js?v=101"></script>
    <script src="./matey-lock.js?v=101"></script>
    <script src="./matey-vots.js?v=101"></script>
    <script src="./vots-ui.js?v=101"></script>
    <script>
      /* Font selector toolbar — same font set as the Journal editor.
         Applies the chosen family to the writing canvas and persists it. */
      (function () {
        'use strict';
        var FONTS = [
          { name: 'Inter', family: "'Inter', sans-serif" },
          { name: 'Space Grotesk', family: "'Space Grotesk', sans-serif" },
          { name: 'DM Sans', family: "'DM Sans', sans-serif" },
          { name: 'Outfit', family: "'Outfit', sans-serif" }
        ];
        var KEY = 'matey-vots-font';
        var bar = document.getElementById('vts-font-bar');
        var canvas = document.getElementById('vts-entry-content');
        if (!bar || !canvas) return;
        var saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }
        if (saved) canvas.style.fontFamily = saved;
        FONTS.forEach(function (f) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'vts-font-btn' + (saved === f.family ? ' active' : '');
          btn.style.fontFamily = f.family;
          btn.textContent = f.name;
          btn.title = 'Set editor font: ' + f.name;
          btn.addEventListener('click', function () {
            canvas.style.fontFamily = f.family;
            try { localStorage.setItem(KEY, f.family); } catch (e) {}
            Array.prototype.forEach.call(bar.children, function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
          });
          bar.appendChild(btn);
        });
      })();
    </script>
  </body>
</html>
