<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: #e8e8e8; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif; }
      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; flex-direction: column; }
    </style>
    <script>
      /* Instant matte background — set --app-bg before first paint so the
         html { background-color: var(--app-bg) !important } rule resolves
         to the themed color immediately. No white flash. */
      try {
        var _bgs = { graphitexx: '#000000', 'cool-panda': '#1a1d23', minimal: '#fafafa' };
        var _t = localStorage.getItem('matey-theme') || 'graphitexx';
        var _bg = _bgs[_t] || _bgs.graphitexx;
        document.documentElement.style.setProperty('--app-bg', _bg);
        document.documentElement.style.backgroundColor = _bg;
      } catch (e) {}
    </script>
    <meta name="description" content="Matey — your on-device personal AI assistant with BYOK AI providers, offline Whisper STT, encrypted journal, and syntax-driven note vault." />
    <link rel="icon" href="./images/matey-logo.png" type="image/png" />
    <meta name="theme-color" content="#000000" />
    <title>Matey - My-VOTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="./version.js"></script>
    <script>
      document.write('<link rel="stylesheet" href="./matey-preview.css?v=' + MATEY_CSS_VERSION + '">');
    </script>
    <script src="./matey-boot.js?v=100"></script>
    <script src="./matey-sentry.js?v=100"></script>
  </head>
  <body>

    <div class="app-shell">
      <header class="header">
        <div class="header-top">
          <img class="matey-logo" src="./images/matey-logo.png" alt="Matey" />
          <div class="workspace-display-container" id="workspace-display-container">
            <div class="workspace-dropdown" id="workspace-dropdown">
              <span class="workspace-name" id="workspace-display">Workspace</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="workspace-selector" id="workspace-selector"></div>
          </div>
          <div class="header-actions">
            <svg class="usage-ring" viewBox="0 0 36 36" id="usage-ring" aria-hidden="true"><circle class="usage-ring-track" cx="18" cy="18" r="15"></circle><path class="usage-ring-segment" d="" /></svg>
            <button class="incognito-trigger" type="button" aria-label="Incognito" title="Incognito">
              <svg class="incognito-ghost" viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path class="ghost-body" d="M 50 4 C 20 4 5 28 5 52 L 5 92 C 5 105 15 105 20 98 C 25 105 35 105 40 98 C 45 105 55 105 60 98 C 65 105 75 105 80 98 C 85 105 95 105 95 92 L 95 52 C 95 28 80 4 50 4 Z"/>
                <ellipse class="ghost-eye" cx="35" cy="50" rx="10" ry="15"/>
                <ellipse class="ghost-pupil" cx="35" cy="52" rx="4" ry="8"/>
                <ellipse class="ghost-eye" cx="65" cy="50" rx="10" ry="15"/>
                <ellipse class="ghost-pupil" cx="65" cy="52" rx="4" ry="8"/>
                <path class="ghost-eyebrow" d="M 26 34 L 38 40"/>
                <path class="ghost-eyebrow" d="M 74 34 L 62 40"/>
                <path class="ghost-mouth" d="M 38 78 Q 50 94 62 78 Q 50 88 38 78 Z"/>
                <path class="ghost-teeth" d="M 40 80 L 43 85 L 46 80 L 49 85 L 52 80 L 55 85 L 58 80 L 60 82"/>
              </svg>
            </button>
            <button class="icon-btn settings-trigger" type="button" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg></button>
          </div>
        </div>
      </header>

      <nav class="tabs-wrap" id="tabs-wrap">
        <div class="tabs">
          <a class="tab" href="./lifestyle.html">Lifestyle</a>
          <a class="tab active" href="./vots.html">My-VOTS</a>
          <a class="tab" href="./raw-editor.html">&gt;edit</a>
          <a class="tab" href="./journal.html">Journal</a>
          <a class="tab" href="./preview.html#agent">&gt;agent</a>
        </div>
      </nav>
      <div class="tab-border" style="height:1px;background:#1a1a1a;width:100%"></div>

      <!-- Landing screen: simple, no card/box, plain background -->
      <main class="vots-page" id="vots-page">
        <!-- Link gate (landing screen) -->
        <div class="vots-link-gate" id="vots-link-gate">
          <!-- ⋮ three-dot menu button (top-right, same style as Journal) -->
          <button class="journal-btn journal-btn-sm journal-header-menu-btn" id="vots-header-menu-btn" type="button" title="More">⋮</button>

          <!-- Link input + Start Entry button directly on background (no card) -->
          <div class="vots-link-field">
            <input type="url" id="vots-link-input" class="vots-link-input" placeholder="https://twitter.com/user/status/12345 or https://youtube.com/watch?v=..." autocomplete="off" />
            <button class="vots-link-submit" id="vots-link-submit" type="button">Start Entry</button>
          </div>

          <!-- Light gray instructional helper text -->
          <div class="vots-link-gate-desc" id="vots-link-helper">
            My-VOTS is for responding to something public — paste a link and write your own take on it.
          </div>
        </div>

        <!-- Three-dot menu dropdown (screen-level, same as Journal) -->
        <div class="journal-three-dot-menu" id="vots-three-dot-menu" style="display:none">
          <button class="journal-menu-item" id="vots-delete-entry" type="button">🗑️ Delete</button>
        </div>

        <!-- Entry screen (mirrors Journal entry form structure) -->
        <div class="vots-editor-section" id="vots-editor-section" style="display:none">
          <div class="journal-entry-form" id="vots-entry-form" style="display:none">
            <!-- Title row: title input (flex-grow) + Save button + ⋮ menu -->
            <div class="journal-title-row" id="vots-title-row">
              <input type="text" class="journal-title-input" id="vots-title-input" placeholder="What's this about?" />
              <button class="journal-btn journal-btn-sm journal-save-btn" id="vots-save-entry-btn" type="button" title="Save entry">Save</button>
              <button class="journal-btn journal-btn-sm journal-header-menu-btn" id="vots-entry-menu-btn" type="button" title="More">⋮</button>
            </div>

            <!-- Auto-generated date/time (not editable) -->
            <div class="journal-datetime" id="vots-datetime"></div>

            <!-- Quiet link attachment (hidden, stored in background) -->
            <input type="hidden" id="vots-link-ref-input" />

            <!-- Main content textarea (mirrors journal-content-input) -->
            <div class="journal-content-wrapper" id="vots-content-wrapper">
              <textarea class="journal-content-input" id="vots-content-input" placeholder="What's your response?" rows="8"></textarea>
              <input type="file" id="vots-attach-input" accept="*/*" style="display:none" />
              <div class="journal-attachments" id="vots-attachments"></div>
            </div>

            <!-- Attachment dropdown menu (reuses Journal classes) -->
            <div class="journal-attach-menu" id="vots-attach-menu" style="display:none">
              <button class="journal-menu-item" id="vots-add-image" type="button">📷 Photo</button>
              <button class="journal-menu-item" id="vots-add-file" type="button">📄 File</button>
              <button class="journal-menu-item" id="vots-add-location" type="button">📍 Location</button>
            </div>
          </div>

          <!-- Three-dot menu dropdown (entry-level, same as Journal) -->
          <div class="journal-three-dot-menu" id="vots-entry-three-dot-menu" style="display:none">
            <button class="journal-menu-item" id="vots-save-as-btn" type="button">💾 Save as</button>
            <button class="journal-menu-item" id="vots-delete-entry-btn" type="button">🗑️ Delete</button>
          </div>
        </div>

        <!-- History section -->
        <div class="vots-history-section" id="vots-history-section">
          <div class="vots-history" id="vots-history"></div>
          <div class="vots-history-empty-centered" id="vots-history-empty">No entries yet. Create one above.</div>
        </div>
      </main>

      <!-- Shared edit/symbol/mic toolbar (injected by matey-toolbar.js) -->
      <div class="md-composer md-composer-symbols-only vots-toolbar matey-toolbar-container" id="vots-composer"></div>
    </div>

    <!-- PIN Lock Screen -->
    <div class="journal-lock-screen" id="vots-lock-screen" style="display:none">
      <div class="journal-lock-content">
        <div class="journal-lock-icon">🔒</div>
        <div class="journal-lock-title">My-VOTS Locked</div>
        <div class="journal-lock-desc">Enter your PIN to unlock your entries.</div>
        <input type="password" id="vots-pin-input" autocomplete="off" inputmode="numeric" pattern="[0-9]*" />
        <button class="journal-btn journal-btn-primary" id="vots-pin-submit" type="button">Unlock</button>
        <button class="journal-btn journal-btn-secondary" id="vots-setup-lock-btn" type="button" style="display:none">Set Up My-VOTS PIN</button>
      </div>
    </div>

    <!-- Settings Modal (PIN lock) -->
    <div class="journal-settings-overlay" id="vots-settings-overlay" style="display:none">
      <div class="journal-settings-modal">
        <div class="journal-settings-header">
          <h3>My-VOTS Settings</h3>
          <button class="journal-settings-close" id="vots-settings-close" type="button">×</button>
        </div>
        <div class="journal-settings-body">
          <div class="journal-settings-section">
            <h4>Security</h4>
            <div class="journal-setting-row">
              <label>PIN Lock</label>
              <button class="journal-setting-btn" id="vots-pin-toggle" type="button">Enable</button>
            </div>
          </div>
          <div class="journal-settings-section">
            <h4>Entries</h4>
            <div class="journal-setting-row">
              <label>Export all entries</label>
              <button class="journal-setting-btn" id="vots-export-btn" type="button">Export</button>
            </div>
          </div>
          <div class="journal-settings-section">
            <h4>Privacy</h4>
            <div class="journal-setting-row">
              <label>Privacy Policy</label>
              <a href="./privacy.html" class="journal-setting-btn" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-align:center">View</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Confirm dialog -->
    <div class="vots-confirm-overlay" id="vots-confirm-overlay">
      <div class="vots-confirm-dialog">
        <div class="vots-confirm-icon">⚠️</div>
        <div class="vots-confirm-title" id="vots-confirm-title"></div>
        <div class="vots-confirm-desc" id="vots-confirm-desc"></div>
        <div class="vots-confirm-actions">
          <button class="vots-btn-secondary" id="vots-confirm-cancel">Cancel</button>
          <button class="vots-btn-danger" id="vots-confirm-proceed">Proceed</button>
        </div>
      </div>
    </div>

    <script src="./matey-themes.js?v=100"></script>
    <script src="./matey-swipe.js?v=100"></script>
    <script src="./matey-profile.js?v=100"></script>
    <script src="./matey-greet.js?v=100"></script>
    <script src="./matey-feed.js?v=100"></script>
    <script src="./matey-settings.js?v=100"></script>
    <script src="./matey-fs.js?v=100"></script>
    <script src="./matey-keyboard.js?v=100"></script>
    <script src="./matey-whisper.js?v=100"></script>
    <script src="./matey-stt.js?v=100"></script>
    <script src="./matey-mic.js?v=100"></script>
    <script src="./matey-toolbar.js?v=100"></script>
    <script src="./matey-init.js?v=100"></script>
    <script src="./matey-recall.js?v=100"></script>
    <script src="./matey-rss.js?v=100"></script>
    <script src="./matey-license.js?v=100"></script>
    <script src="./matey-adaptive.js?v=100"></script>
    <script src="./matey-behavior.js?v=100"></script>
    <script type="module">import { mateyCoach } from './matey-coach.js'; window.mateyCoach = mateyCoach;</script>
    <script src="./matey-ai.js?v=100"></script>
    <script src="./matey-hooks-manager.js?v=100"></script>
    <script src="./matey-vots.js?v=100"></script>
    <script src="./matey-tabs.js?v=100"></script>
    <script src="./matey-byok.js?v=100"></script>
    <script src="./matey-beat.js?v=100"></script>
    <script src="./matey-lifestyle.js?v=100"></script>
    <script src="./matey-md.js?v=100"></script>
    <script src="./matey-syntax.js?v=100"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.2/mammoth.min.js"></script>
  </body>
</html>
