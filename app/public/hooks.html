<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; border: none; }
    </style>
    <meta name="theme-color" content="#000000" />
    <title>Matey - Semantic Hooks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./matey-preview.css?v=5" />
    <script src="./matey-boot.js?v=5"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="header-top">
          <img class="matey-logo" src="./images/matey-logo.png" alt="Matey" />
          <div class="header-actions">
            <button class="icon-btn settings-trigger" type="button" aria-label="Settings"></button>
          </div>
        </div>
        <div class="greeting-row">
          <p class="greeting" id="greeting">Good evening</p>
          <span class="greeting-meta" id="greeting-meta"></span>
        </div>
        <div class="vibe-prompt" id="vibe-prompt"></div>
        <div class="usage-block">
          <div class="usage-row">
            <span>Usage</span>
            <span>65%</span>
          </div>
          <div class="usage-bar"><div class="usage-fill"></div></div>
        </div>
      </header>

      <nav class="tabs-wrap">
        <div class="tabs">
          <a class="tab" href="./starring.html">Starring</a>
          <a class="tab active" href="./hooks.html">Hooks</a>
          <a class="tab" href="./markdown.html">Markdown</a>
          <a class="tab" href="./preview.html#custom">Custom</a>
        </div>
      </nav>

      <main class="content" style="display:flex;flex-direction:column;">
        <div class="feed-scroll" id="intel-feed"></div>
        <div class="hook-section">
          <div class="hook-section-label">Follow a keyword</div>
          <form id="hook-form">
            <div class="field">
              <input
                id="keyword-input"
                name="keyword"
                type="text"
                placeholder="e.g. AI chips, space travel, concept design"
                autocomplete="off"
              />
            </div>
            <button class="submit-btn" type="submit">Follow</button>
          </form>
          <button class="submit-btn brief-btn" id="brief-btn" type="button">Refresh briefs</button>
        </div>
      </main>
    </div>

    <div class="pull-hint" id="pull-hint"></div>

    <div class="chat-overlay" id="chat-overlay">
      <div class="chat-backdrop" id="chat-backdrop"></div>
      <div class="chat-dialog">
        <div class="chat-handle"></div>
        <div class="chat-dialog-input">
          <button class="chat-mic" type="button" aria-label="Voice"></button>
          <input type="text" class="chat-field" autocomplete="off" />
          <button class="chat-plus" type="button" aria-label="Add">+</button>
        </div>
        <div class="chat-dialog-body">
          <div class="chat-dialog-empty"></div>
        </div>
      </div>
    </div>
    <script src="./matey-themes.js?v=5"></script>
    <script src="./matey-swipe.js?v=5"></script>
    <script src="./matey-profile.js?v=5"></script>
    <script src="./matey-greet.js?v=5"></script>
    <script src="./matey-feed.js?v=5"></script>
    <script src="./matey-chat.js?v=5"></script>
    <script src="./matey-ai.js?v=5"></script>
    <script src="./matey-tabs.js?v=5"></script>
    <script src="./matey-byok.js?v=5"></script>
    <script src="./matey-syntax.js?v=5"></script>
    <script src="./matey-whisper.js?v=5"></script>
    <script src="./matey-pull.js?v=5"></script>
    <script src="./matey-rss.js?v=5"></script>
    <script src="./matey-license.js?v=6"></script>
    <script src="./matey-hooks.js?v=6"></script>
    <script src="./matey-recall.js?v=6"></script>
    <script src="./matey-settings.js?v=6"></script>
    <script src="./matey-init.js?v=5"></script>
    <script>
      // Hooks page behavior is owned by matey-hooks.js (keyword -> news -> AI briefs)
    </script>

  </body>
</html>
