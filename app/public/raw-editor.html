<!doctype html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #000000; overflow: hidden; }
      .app-shell { position: fixed; inset: 0; width: 100%; max-width: none; display: flex; flex-direction: column; }
    </style>
    <meta name="description" content="Matey - >edit — Raw text editor with file explorer, voice input, and language routing" />
    <link rel="icon" href="./images/matey-logo.png" type="image/png" />
    <meta name="theme-color" content="#000000" />
    <title>Matey - >edit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="./version.js"></script>
    <script>
      document.write('<link rel="stylesheet" href="./matey-preview.css?v=' + MATEY_CSS_VERSION + '">');
    </script>
    <script src="./matey-boot.js?v=100"></script>
    <script src="./matey-sentry.js?v=101"></script>
      <script src="./matey-header.js?v=1"></script>
  </head>
  <body>
    <div class="app-shell">
      <div class="edit-page">
        <!-- File Explorer (shown by default) -->
        <div id="file-explorer" class="file-explorer" style="flex-direction: column; height: 100%;">
          <div id="file-list-container" class="file-list-container" style="flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch;">
          <div class="file-card">
            <div class="file-card-top" onclick="window.openFile('README.md')">
              <div class="file-info">
                <span class="ext-badge md">.md</span>
                <span class="file-name">README.md</span>
              </div>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
            </div>
          </div>
          <div class="file-card">
            <div class="file-card-top" onclick="window.openFile('build.gradle')">
              <div class="file-info">
                <span class="ext-badge gradle">.gradle</span>
                <span class="file-name">build.gradle</span>
              </div>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
            </div>
          </div>
          <div class="file-card">
            <div class="file-card-top" onclick="window.openFile('config.json')">
              <div class="file-info">
                <span class="ext-badge json">.json</span>
                <span class="file-name">config.json</span>
              </div>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
            </div>
          </div>
          <div class="file-card">
            <div class="file-card-top" onclick="window.openFile('data.csv')">
              <div class="file-info">
                <span class="ext-badge csv">.csv</span>
                <span class="file-name">data.csv</span>
              </div>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
            </div>
          </div>
          <div class="file-card">
            <div class="file-card-top" onclick="window.openFile('notes.txt')">
              <div class="file-info">
                <span class="ext-badge txt">.txt</span>
                <span class="file-name">notes.txt</span>
              </div>
              <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
            </div>
          </div>
        </div>
          <div id="file-explorer-empty" class="file-explorer-empty" style="display: none; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; color: var(--text-muted); text-align: center;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 16px; opacity: 0.5;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <p style="font-size: 16px; font-weight: 600; color: var(--text-primary); margin: 0 0 8px;">No files yet</p>
            <p style="font-size: 14px; margin: 0;">Tap + to create or import a file</p>
          </div>
        </div>

        <!-- Editor State (hidden by default) -->
        <div id="editor-view" class="editor-view hidden" style="flex-direction: column; height: 100%;">
          <div class="edit-header">
            <div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1;">
              <span id="edit-lang-badge" class="lang-badge">TXT</span>
              <span id="edit-file-path" class="file-path">No file open</span>
              <span id="edit-dirty-dot" style="display:none; color:#f59e0b; font-size:14px; line-height:1;">●</span>
            </div>
            <div class="actions">
              <button id="edit-btn-back" class="secondary">Back</button>
              <button id="edit-btn-saveas" class="secondary">Save As</button>
              <button id="edit-btn-delete" class="danger">Delete</button>
            </div>
          </div>

          <div class="edit-viewport" id="edit-viewport">
            <div id="edit-editor-container" data-matey-ide-skip-header="true" style="width:100%; height:100%;"></div>
          </div>

          <div class="edit-footer">
            <div class="status" id="edit-status">Ready — Cmd/Ctrl+K for command palette</div>
          </div>
        </div>
      </div>
</body>
</html>
