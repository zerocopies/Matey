            <img src="./images/matey-logo.png" alt="Matey" class="agent-welcome-logo" id="agent-welcome-logo" />

        <div class="md-composer" id="md-composer">

            </button>
            <textarea class="md-compose-input" id="md-compose-input" autocomplete="off" placeholder="Type and press send..." rows="1"></textarea>
            <div class="md-compose-actions">
              <button class="md-send-btn" id="md-send" type="button" aria-label="Send">

    <script>
      var chat = document.getElementById('agent-chat');
      var input = document.getElementById('md-compose-input');
      var sendBtn = document.getElementById('md-send');
      var attachBtn = document.getElementById('md-attach');
      var attachInput = document.getElementById('md-attach-input');
      var pendingFiles = [];
      var convHistory = [];
      var pendingAttachmentText = null;

      function scrollToBottom() {
        if (chat) chat.scrollTop = chat.scrollHeight;
      }

      function clearInput() {
        if (input) { input.value = ''; input.style.height = ''; }
      }

      function resizeTextarea() {
        if (!input) return;
        input.style.height = 'auto';
        input.style.height = input.scrollHeight + 'px';
        if (input.scrollHeight > 160) input.style.height = '160px';
      }

      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
      }

      function createMsgBubble(cls, content) {
        var div = document.createElement('div');
        div.className = cls;
        div.textContent = content;
        return div;
      }

      async function extractFileText(file) {
        var reader = new FileReader();
        return new Promise(function (resolve) {
          reader.onload = function (e) {
            var result = e.target.result;
            var lower = file.type.toLowerCase();

            if (lower.indexOf('text/') !== -1 || lower.indexOf('json') !== -1) {
              resolve(result);
            } else if (lower.indexOf('image/') === 0) {
              resolve('[Image attached: ' + file.name + ']');
            } else if (lower === 'application/pdf') {
              try {
                var loadingTask = pdfjsLib.getDocument({ data: result });
                loadingTask.promise.then(function (pdf) {
                  var text = '';
                  var pageCount = pdf.numPages;
                  var pages = [];
                  for (var i = 1; i <= pageCount; i++) {
                    pages.push(pdf.getPage(i));
                  }
                  Promise.all(pages).then(function (pageResults) {
                    var getText = function (page) {
                      return page.getTextContent().then(function (tc) {
                        return tc.items.map(function (item) { return item.str; }).join('');
                      });
                    };
                    Promise.all(pageResults.map(getText)).then(function (texts) {
                      resolve(texts.join('\n\n'));
                    }).catch(function () { resolve('[Could not extract text from PDF]'); });
                  });
                }).catch(function () { resolve('[Could not parse PDF]'); });
              } catch (e) {
                resolve('[PDF parse error]');
              }
            } else if (lower === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
              try {
                var data = new Uint8Array(result.slice(0, result.length));
                if (window.mammoth) {
                  mammoth.extract_raw_text({ data: data }).then(function (r) {
                    resolve(r.value);
                  }).catch(function () { resolve('[Could not extract text from DOCX]'); });
                } else {
                  resolve('[Mammoth library not loaded]');
                }
              } catch (e) {
                resolve('[DOCX parse error]');
              }
            } else {
              resolve('[File: ' + file.name + ' (' + file.type + ', ' + formatFileSize(file.size) + ')]');
            }
          };
          reader.onerror = function () { resolve('[Error reading file]'); };

          if (file.type.indexOf('image/') === 0) {
            reader.readAsDataURL(file);
          } else if (file.type === 'application/pdf') {
            reader.readAsArrayBuffer(file);
          } else if (file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
            reader.readAsArrayBuffer(file);
          } else {
            reader.readAsText(file);
          }
        });
      }

      async function buildUserMessage(text) {
        var content = text;
        var attachments = pendingFiles.slice();

        if (attachments.length > 0) {
          var attachmentContexts = [];
          for (var i = 0; i < attachments.length; i++) {
            var f = attachments[i];
            var extracted = await extractFileText(f);
            if (extracted && extracted.indexOf('[') !== 0) {
              attachmentContexts.push('File "' + f.name + '":\n' + extracted);
            } else {
              attachmentContexts.push(extracted);
            }
          }
          content = text + '\n\n[Context from attached files:\n' + attachmentContexts.join('\n---\n') + '\n]';
        }
        return { role: 'user', content: content };
      }

      function sendMessage() {
        var text = input ? input.value.trim() : '';
        if ((!text && pendingFiles.length === 0) || !chat) return;

        var welcome = document.getElementById('agent-welcome');
        if (welcome) welcome.style.display = 'none';

        if (window.MateyBehavior) MateyBehavior.record('user_prompt', { text: text });
        if (window.MateyCoach) MateyCoach.recordPrompt(text);

        buildUserMessage(text).then(function (userMsg) {
          convHistory.push(userMsg);

          if (text) {
            chat.appendChild(createMsgBubble('agent-msg agent-user', text));
          }
          if (pendingFiles.length > 0) {
            pendingFiles.forEach(function (f) {
              var bubble = createMsgBubble('agent-msg agent-user', f.name + ' (' + formatFileSize(f.size) + ')');
              bubble.style.cssText = 'opacity:0.7;font-size:13px;';
              chat.appendChild(bubble);
            });
          }

          clearInput();
          pendingFiles = [];

          var resp = document.createElement('div');
          resp.className = 'agent-msg agent-reply';
          resp.innerHTML = '<img src="./images/matey-logo.png" class="ai-thinking-logo" alt="Thinking…" />';
          chat.appendChild(resp);
          scrollToBottom();

          if (!window.MateyByok) {
            resp.textContent = 'No BYOK provider configured. Add one in Settings → BYOK Models.';
            return;
          }

          MateyByok.chat(convHistory).then(function (reply) {
            resp.textContent = reply || 'No response from provider.';
            convHistory.push({ role: 'assistant', content: reply || 'No response from provider.' });
          }).catch(function (err) {
            resp.textContent = 'Error: ' + (err.message || err);
            convHistory.push({ role: 'assistant', content: 'Error: ' + (err.message || err) });
          });
        });
      }

      if (sendBtn) sendBtn.addEventListener('click', sendMessage);
      if (attachBtn && attachInput) {
        attachBtn.addEventListener('click', function () { attachInput.click(); });
        attachInput.addEventListener('change', function () {
          var files = Array.prototype.slice.call(this.files || []);
          files.forEach(function (file) {
            pendingFiles.push(file);
            if (file.type.indexOf('image/') === 0) {
              var url = URL.createObjectURL(file);
              var msg = document.createElement('div');
              msg.className = 'agent-msg agent-user';
              msg.style.cssText = 'max-width:220px;';
              var img = document.createElement('img');
              img.src = url;
              img.style.maxWidth = '200px';
              img.style.borderRadius = '8px';
              msg.appendChild(img);
              chat.appendChild(msg);
              scrollToBottom();
            } else {
              var msg2 = document.createElement('div');
              msg2.className = 'agent-msg agent-user';
              msg2.innerHTML = '<small style="opacity:0.7;">📎 ' + escapeHtml(file.name) + ' (' + formatFileSize(file.size) + ')</small>';
              chat.appendChild(msg2);
              scrollToBottom();
            }
          });
          this.value = '';
        });
      }
      if (input) {
        input.addEventListener('input', resizeTextarea);
        input.addEventListener('keypress', function (e) {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
      }
      var voiceBtn = document.getElementById('md-voice');
      var recognizing = false;
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR) {
        var recognition = new SR();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        recognition.onresult = function (e) {
          var finals = '';
          for (var i = e.resultIndex; i < e.results.length; i++) {
            var t = e.results[i][0].transcript;
            if (e.results[i].isFinal) finals += t;
            else if (input) input.value += t;
          }
          if (finals && input) { input.value += finals; resizeTextarea(); }
        };
        recognition.onerror = function () { recognizing = false; if (voiceBtn) voiceBtn.style.opacity = ''; };
        recognition.onend = function () { recognizing = false; if (voiceBtn) voiceBtn.style.opacity = ''; };
        voiceBtn.addEventListener('click', function () {
          if (recognizing) {
            recognition.stop();
            recognizing = false;
            voiceBtn.style.opacity = '';
          } else {
            if (input) input.focus();
            recognizing = true;
            voiceBtn.style.opacity = '0.5';
            recognition.start();
          }
        });
      } else if (voiceBtn) {
        voiceBtn.style.display = 'none';
      }

      if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.worker.min.js';
      }
    </script>
