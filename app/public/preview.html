<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; }
    </style>
    <meta name="theme-color" content="#000000" />
    <title>Matey - Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./matey-preview.css?v=13" />

  </head>
  <body>
    <div class="app-shell">
      <div class="pull-hint" id="pull-hint"></div>
      <header class="header">
        <div class="header-top">
          <img class="matey-logo" src="./images/matey-logo.png" alt="Matey" />
          <div class="header-actions">
            <button class="incognito-trigger" type="button" aria-label="Incognito" title="Incognito">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.5 2 3 6 3 9c0 2 1 3 1 5 0 2-1 3-2 4s-1 2 0 3c1 1 2 0 3-1s2-2 3-1 2 1 3 1 2-1 3-1 2 1 3 1c1 0 2-1 2-2s-1-2-2-3-2-2-2-4c0-2 1-3 1-5 0-3-3.5-7-8.5-7z"/>
              </svg>
            </button>
            <button class="icon-btn settings-trigger" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg></button>
          </div>
        </div>
        <div class="greeting-row">
          <p class="greeting" id="greeting">Good evening</p>
          <span class="greeting-meta" id="greeting-meta"></span>
        </div>
        <div class="vibe-prompt" id="vibe-prompt"></div>
      </header>

      <nav class="tabs-wrap" id="tabs-wrap">
        <div class="tabs">
          <a class="tab" href="./starring.html">Starring</a>
          <a class="tab" href="./hooks.html">Hooks</a>
          <a class="tab" href="./markdown.html">Markdown</a>
          <a class="tab active" href="./preview.html#agent">AGENTIC-AI</a>
        </div>
      </nav>

      <div class="usage-bar-container">
        <div class="usage-info">
          <span>Usage</span>
          <span id="usage-percent">65%</span>
        </div>
        <div class="usage-bar"><div class="usage-fill" id="usage-fill"></div></div>
      </div>

      <div class="workspace-bar-wrap">
        <span class="workspace-name">No workspace set</span>
        <button class="workspace-btn" id="workspace-btn" type="button" aria-label="Set Workspace" title="Set Workspace">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><circle cx="10" cy="8" r="2"></circle><path d="M2 12l8-8v8l-8 8z"></path></svg>
        </button>
      </div>

      <div class="content-section">
        <div class="section-border"></div>
        <main class="agentic-display" id="page-copy">AGENTIC-AI ready — ask me anything</main>
        <div class="agentic-results" id="agentic-results"></div>
      </div>
      <div class="agentic-input-bar" id="agentic-input">
        <button class="agentic-mic" id="agentic-mic" type="button" aria-label="Voice input">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 8.9c0 4.7 6 8.8 7 9.5.6-.7 7-4.8 7-9.5C19 5.1 15.9 2 12 2z"></path></svg>
        </button>
        <input type="text" class="agentic-field" id="agentic-field" autocomplete="off" placeholder="Ask Matey AI agent..." />
        <button class="agentic-send" id="agentic-send" type="button" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 12 22 2 2 11 13 22 2" fill="currentColor"></polygon></svg>
        </button>
      </div>
    </div>
    <script src="./matey-boot.js?v=13"></script>
    <script src="./matey-themes.js?v=13"></script>
    <script src="./matey-swipe.js?v=13"></script>
    <script src="./matey-profile.js?v=13"></script>
    <script src="./matey-greet.js?v=13"></script>
    <script src="./matey-feed.js?v=13"></script>
    <script src="./matey-ai.js?v=13"></script>
    <script src="./matey-tabs.js?v=13"></script>
    <script src="./matey-byok.js?v=13"></script>
    <script src="./matey-living.js?v=13"></script>
    <script src="./matey-lifestyle.js?v=13"></script>
    <script src="./matey-settings.js?v=13"></script>
    <script src="./matey-syntax.js?v=13"></script>
    <script src="./matey-whisper.js?v=13"></script>
    <script src="./matey-rss.js?v=13"></script>
    <script src="./matey-license.js?v=13"></script>
    <script src="./matey-recall.js?v=13"></script>
    <script src="./matey-behavior.js?v=13"></script>
    <script src="./matey-adaptive.js?v=13"></script>
    <script src="./matey-init.js?v=13"></script>
    <script src="./matey-hooks.js?v=13"></script>
    <script src="./matey-keyboard.js?v=13"></script>
    <script src="./matey-fs.js?v=13"></script>
    <script src="./matey-hooks-manager.js?v=13"></script>
</body>
</html>
