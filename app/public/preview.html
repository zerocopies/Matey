    <script>
      var chat = document.getElementById('agent-chat');
      var input = document.getElementById('md-compose-input');
      var sendBtn = document.getElementById('md-send');
      var attachBtn = document.getElementById('md-attach');
      var attachInput = document.getElementById('md-attach-input');
      var pillsBar = document.getElementById('md-attach-pills');
      var pendingFiles = [];
      var convHistory = [];

      /* ===== Visual Model Picker (TASK 1) — solid dark, no glass effects ===== */
      var modelBtn = document.getElementById('md-model-btn');
      var modelMenu = document.getElementById('md-model-menu');
      var modelFast = document.getElementById('md-model-fast');
      var modelHeavy = document.getElementById('md-model-heavy');
      var modelHead = document.getElementById('md-model-menu-head');
      var modelAutoBtn = document.getElementById('md-model-auto');

      function _providersList() {
        try { return JSON.parse(localStorage.getItem('matey-providers') || '[]'); } catch (e) { return []; }
      }
      function _saveProviders(list) {
        try { localStorage.setItem('matey-providers', JSON.stringify(list)); } catch (e) {}
      }
      function _textProviderIndex(list) {
        for (var i = 0; i < list.length; i++) {
          var caps = list[i].capabilities || [];
          if (caps.indexOf('text') !== -1 || caps.indexOf('text-gen') !== -1 || !caps.length) return i;
        }
        return list.length ? 0 : -1;
      }
      function _prettyModel(model) {
        var m = String(model || '').toLowerCase();
        if (m.indexOf('haiku') !== -1) return '⚡ Haiku';
        if (m.indexOf('flash') !== -1) return '⚡ Flash';
        if (m.indexOf('mini') !== -1) return '⚡ Mini';
        if (m.indexOf('sonnet') !== -1) return '🧠 Sonnet';
        if (m.indexOf('opus') !== -1) return '🧠 Opus';
        if (m.indexOf('pro') !== -1) return '🧠 Pro';
        if (m.indexOf('grok') !== -1) return '⚡ Grok';
        if (m.indexOf('command') !== -1) return '⚡ Command';
        if (m.indexOf('llama') !== -1) return '⚡ Llama';
        if (m.indexOf('qwen') !== -1) return '⚡ Qwen';
        if (!m || m === 'auto' || m === 'auto:free' || m === 'default') return '⚡ Auto';
        var short = String(model).replace(/^[a-z0-9._-]+\/[^/]+\//, '').replace(/^models\//, '');
        return '⚡ ' + short;
      }
      function _renderModelRow(container, model, current) {
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'md-model-opt' + (current === model ? ' is-active' : '');
        row.textContent = _prettyModel(model);
        row.title = model;
        row.addEventListener('click', function () {
          var l2 = _providersList();
          var i2 = _textProviderIndex(l2);
          if (i2 === -1) return;
          l2[i2].model = model;
          _saveProviders(l2);
          if (modelBtn) modelBtn.textContent = _prettyModel(model);
          if (modelMenu) modelMenu.hidden = true;
          if (window.AgentToast) window.AgentToast.show('Agent model → ' + _prettyModel(model), false);
        });
        container.appendChild(row);
      }
      function _openModelMenu() {
        var list = _providersList();
        var idx = _textProviderIndex(list);
        var p = idx !== -1 ? list[idx] : null;
        var preset = null;
        if (p && window.MateyProviderPresets) {
          try { preset = window.MateyProviderPresets.detect(p.apiKey); } catch (e) { preset = null; }
        }
        if (modelHead) {
          modelHead.textContent = p
            ? (preset && preset.name ? preset.name + ' · ' : '') + String(p.baseUrl || 'custom').replace(/^https?:\/\//, '').split('/')[0]
            : 'No AI provider configured';
        }
        var fast = [];
        var heavy = [];
        if (preset && preset.fastOptions) fast = fast.concat(preset.fastOptions);
        if (preset && preset.heavyOptions) heavy = heavy.concat(preset.heavyOptions);
        if (p && p.model && p.model !== 'auto' && p.model !== 'auto:free' && p.model !== 'default') {
          if (fast.indexOf(p.model) === -1 && heavy.indexOf(p.model) === -1) {
            (String(p.model).match(/haiku|flash|mini|turbo|fast|lite|grok|command|llama|qwen/i) ? fast : heavy).push(p.model);
          }
        }
        if (modelFast && modelHeavy) {
          modelFast.innerHTML = '';
          modelHeavy.innerHTML = '';
          var current = p ? p.model : '';
          if (fast.length) fast.forEach(function (m) { _renderModelRow(modelFast, m, current); });
          if (heavy.length) heavy.forEach(function (m) { _renderModelRow(modelHeavy, m, current); });
          if (!fast.length && !heavy.length) {
            var note = document.createElement('div');
            note.className = 'md-model-auto';
            note.textContent = p ? 'Custom provider — set a model in Settings → BYOK Models.' : 'Add a provider in Settings → BYOK Models.';
            modelFast.appendChild(note);
          }
        }
        if (modelMenu) modelMenu.hidden = false;
      }
      function _syncModelButton() {
        var list = _providersList();
        var idx = _textProviderIndex(list);
        var model = idx !== -1 ? list[idx].model : '';
        if (modelBtn) modelBtn.textContent = _prettyModel(model);
      }
      if (modelBtn && modelMenu) {
        modelBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (modelMenu.hidden) { _openModelMenu(); } else { modelMenu.hidden = true; }
        });
        if (modelAutoBtn) {
          modelAutoBtn.addEventListener('click', function () {
            var l = _providersList();
            var i = _textProviderIndex(l);
            if (i === -1) return;
            l[i].model = 'auto';
            _saveProviders(l);
            if (modelBtn) modelBtn.textContent = '⚡ Auto';
            if (modelMenu) modelMenu.hidden = true;
            if (window.AgentToast) window.AgentToast.show('Agent model → Auto (fast default)', false);
          });
        }
        document.addEventListener('click', function (e) {
          if (!modelMenu.hidden && !modelBtn.contains(e.target) && !modelMenu.contains(e.target)) modelMenu.hidden = true;
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { modelMenu.hidden = true; }
        });
        _syncModelButton();
      }
      var pendingAttachmentText = null;
      var ideMode = false;

      function scrollToBottom() {
        if (chat) chat.scrollTop = chat.scrollHeight;
      }

      // IDE toggle button
      var ideToggle = document.getElementById('agent-ide-toggle');
      if (ideToggle && window.MateyIDE) {
        ideToggle.addEventListener('click', function () {
          if (!ideMode) {
            ideMode = true;
            var toggleText = ideToggle.querySelector('.ide-toggle-text');
            if (toggleText) toggleText.textContent = 'Chat';
            chat.style.display = 'none';
            var ideContainer = document.createElement('div');
            ideContainer.id = 'ide-container';
            ideContainer.style.cssText = 'display:flex; flex-direction:column; height:calc(100vh - 70px);';
            var parent = document.querySelector('.agent-page');
            parent.insertBefore(ideContainer, chat.nextSibling);
            var provider = window.MateyByok ? (window.MateyByok.getProvider('text') || {}) : {};
            window.mateyIDE = new window.MateyIDE('ide-container', provider);
            window.MateyCmd.setIDE(window.mateyIDE);
          } else {
            ideMode = false;
            var toggleText = ideToggle.querySelector('.ide-toggle-text');
            if (toggleText) toggleText.textContent = 'IDE';
            chat.style.display = 'block';
            var container = document.getElementById('ide-container');
            if (container) container.remove();
          }
        });
      }

      function clearInput() {
        if (input) { input.value = ''; input.style.height = ''; }
      }

      function resizeTextarea() {
        if (!input) return;
        input.style.height = 'auto';
        input.style.height = input.scrollHeight + 'px';
        if (input.scrollHeight > 160) input.style.height = '160px';
      }

      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
      }

      function createMsgBubble(cls, content) {
        var div = document.createElement('div');
        div.className = cls;
        div.innerHTML = renderMarkdown(content);
        return div;
      }

      function renderMarkdown(text) {
        var esc = function (s) {
          var d = document.createElement('div');
          d.textContent = s;
          return d.innerHTML;
        };

        var lines = esc(text).split('\n');
        var html = [];
        var inCode = false;
        var codeBuf = [];
        var inList = false;
        var listType = null;

        function closeList() {
          if (inList) {
            html.push(listType === 'ol' ? '</ol>' : '</ul>');
            inList = false;
            listType = null;
          }
        }

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];

          if (inCode) {
            if (line.trim() === '```' || line.trim() === '~~~') {
              html.push('<code>' + codeBuf.join('\n') + '</code>');
              codeBuf = [];
              inCode = false;
            } else {
              codeBuf.push(line);
            }
            continue;
          }

          var codeMatch = line.match(/^```(\w*)$/);
          if (codeMatch) {
            closeList();
            inCode = true;
            codeBuf = [];
            continue;
          }

          var headerMatch = line.match(/^(#{1,6})\s+(.*)$/);
          if (headerMatch) {
            closeList();
            var level = headerMatch[1].length;
            html.push('<h' + level + '>' + inlineMarkdown(headerMatch[2]) + '</h' + level + '>');
            continue;
          }

          var olMatch = line.match(/^(\d+)\.\s+(.*)$/);
          if (olMatch) {
            if (!inList || listType !== 'ol') {
              closeList();
              inList = true;
              listType = 'ol';
              html.push('<ol>');
            }
            html.push('<li>' + inlineMarkdown(olMatch[2]) + '</li>');
            continue;
          }

          var ulMatch = line.match(/^[-*]\s+(.*)$/);
          if (ulMatch) {
            if (!inList || listType !== 'ul') {
              closeList();
              inList = true;
              listType = 'ul';
              html.push('<ul>');
            }
            html.push('<li>' + inlineMarkdown(ulMatch[1]) + '</li>');
            continue;
          }

          if (line.trim() === '') {
            closeList();
            continue;
          }

          closeList();
          html.push('<p>' + inlineMarkdown(line) + '</p>');
        }

        closeList();
        return html.join('\n');
      }

      function inlineMarkdown(text) {
        text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        text = text.replace(/```([\s\S]*?)```/g, '<code>$1</code>');
        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
        text = text.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
        text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        text = text.replace(/__(.*?)__/g, '<strong>$1</strong>');
        text = text.replace(/_(.*?)_/g, '<em>$1</em>');
        return text;
      }

      /* ===== Universal file attachment support (Agent tab) =====
         The file input accepts ANY file type (accept all). Text/code documents
         are read via FileReader.readAsText(); spreadsheets (.csv/.xlsx/.xls)
         get raw tabular text/rows extracted into the context window; PDF/DOCX
         keep their existing parsers; images preview inline. */
      function fileKey(file) {
        var parts = String(file.name || '').split('.');
        var ext = parts.length > 1 ? parts.pop().toLowerCase() : '';
        return { ext: ext, mime: String(file.type || '').toLowerCase() };
      }

      function readFileAsText(file) {
        return new Promise(function (resolve) {
          var reader = new FileReader();
          reader.onload = function (e) { resolve(e.target.result); };
          reader.onerror = function () { resolve('[Error reading file]'); };
          reader.readAsText(file);
        });
      }

      function readFileAsArrayBuffer(file) {
        return new Promise(function (resolve) {
          var reader = new FileReader();
          reader.onload = function (e) { resolve(e.target.result); };
          reader.onerror = function () { resolve(null); };
          reader.readAsArrayBuffer(file);
        });
      }

      function isTextLike(file) {
        var k = fileKey(file);
        if (k.mime.indexOf('text/') === 0 || k.mime.indexOf('javascript') !== -1 ||
            k.mime.indexOf('json') !== -1 || k.mime.indexOf('xml') !== -1 ||
            k.mime.indexOf('typescript') !== -1) return true;
        return ['md', 'txt', 'json', 'js', 'mjs', 'cjs', 'ts', 'tsx', 'jsx', 'py',
                'rb', 'go', 'rs', 'java', 'c', 'cpp', 'h', 'html', 'css', 'scss',
                'xml', 'yml', 'yaml', 'sh', 'bash', 'zsh', 'conf', 'ini', 'log', 'svg'].indexOf(k.ext) !== -1;
      }

      function isSpreadsheet(file) {
        var k = fileKey(file);
        return k.ext === 'csv' || k.ext === 'xlsx' || k.ext === 'xls' ||
               k.mime.indexOf('csv') !== -1 || k.mime.indexOf('spreadsheet') !== -1 || k.mime.indexOf('ms-excel') !== -1;
      }

      /* Convert raw CSV text into bounded ' | '-separated table rows for context. */
      function extractCsvRows(text) {
        var rows = String(text).split(/\r?\n/);
        var out = [];
        for (var i = 0; i < rows.length && out.length < 250; i++) {
          var line = rows[i].replace(/\r/g, '').trim();
          if (!line) continue;
          // Split on commas outside double-quoted spans.
          var cells = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
          out.push(cells.map(function (c) { return c.replace(/^"|"$/g, '').trim(); }).slice(0, 40).join(' | '));
        }
        return out.join('\n');
      }

      /* Minimal offline XLSX reader — inflates xl/sharedStrings.xml and
         worksheet XML straight from the ZIP container with DecompressionStream
         (no CDN, fully offline). Flattens cells into raw tabular rows. */
      function sharedStringsToArray(xml) {
        var arr = [], re = /<si>([\s\S]*?)<\/si>/gi, m;
        while ((m = re.exec(xml))) {
          var text = '', tr = /<t[^>]*>([\s\S]*?)<\/t>/g, t;
          while ((t = tr.exec(m[1]))) text += t[1];
          arr.push(text);
        }
        return arr;
      }

      function sheetXmlToRows(sheetXml, shared) {
        var out = [], rows = sheetXml.split(/<\/row>/i);
        for (var r = 0; r < rows.length && out.length < 250; r++) {
          var cells = [], re = /<c([^>]*)>([\s\S]*?)<\/c>/gi, m, hasCell = false;
          while ((m = re.exec(rows[r]))) {
            hasCell = true;
            var type = 'n', tm = /t="([^"]+)"/.exec(m[1]);
            if (tm) type = tm[1];
            var val = null, vr;
            if (type === 's') {
              vr = /<v>([\s\S]*?)<\/v>/.exec(m[2]);
              if (vr) { var idx = parseInt(vr[1], 10); if (!isNaN(idx) && shared[idx] != null) val = shared[idx]; }
            } else if (type === 'inlineStr') {
              var it = /<t[^>]*>([\s\S]*?)<\/t>/.exec(m[2]);
              if (it) val = it[1];
            } else {
              vr = /<v>([\s\S]*?)<\/v>/.exec(m[2]);
              if (vr) val = vr[1];
            }
            if (val != null) { val = String(val).trim(); if (val) cells.push(val); }
          }
          if (hasCell && cells.length) out.push(cells.slice(0, 40).join(' | '));
        }
        return out.join('\n');
      }

      async function extractXlsxText(buffer) {
        if (!window.DecompressionStream) return null;
        try {
          var dv = new DataView(buffer), entries = [], i = 0;
          while (i + 30 <= dv.byteLength) {
            if (dv.getUint32(i, true) !== 0x04034b50) { i++; continue; }
            var compSize = dv.getUint32(i + 18, true);
            var nameLen = dv.getUint16(i + 26, true);
            var extraLen = dv.getUint16(i + 28, true);
            var name = new TextDecoder().decode(new Uint8Array(buffer, i + 30, nameLen));
            var dataStart = i + 30 + nameLen + extraLen;
            if (/^(xl\/sharedStrings\.xml|xl\/worksheets\/sheet\d+\.xml)$/.test(name)) {
              entries.push({ name: name, data: buffer.slice(dataStart, dataStart + compSize) });
            }
            i = dataStart + compSize;
          }
          if (!entries.length) return null;
          var texts = { sheets: [] };
          for (var j = 0; j < entries.length; j++) {
            var ds = new DecompressionStream('deflate-raw');
            var stream = new Blob([entries[j].data]).stream().pipeThrough(ds);
            var inflated = new Uint8Array(await new Response(stream).arrayBuffer());
            var xml = new TextDecoder().decode(inflated);
            if (/sharedStrings/.test(entries[j].name)) texts.shared = sharedStringsToArray(xml);
            else texts.sheets.push(xml);
          }
          if (!texts.sheets.length) return null;
          var out = [];
          texts.sheets.forEach(function (sheetXml, idx) {
            var rows = sheetXmlToRows(sheetXml, texts.shared || []);
            if (rows) out.push('Sheet ' + (idx + 1) + ':\n' + rows);
          });
          return out.join('\n---\n');
        } catch (e) {
          return null;
        }
      }

      async function extractFileText(file) {
        var k = fileKey(file);

        /* Spreadsheets — raw tabular text/rows into the context window */
        if (isSpreadsheet(file)) {
          if (k.ext === 'csv' || k.mime.indexOf('csv') !== -1) {
            var csvText = await readFileAsText(file);
            return 'CSV "' + file.name + '":\n' + extractCsvRows(csvText);
          }
          var buf = await readFileAsArrayBuffer(file);
          if (!buf) return '[Could not read spreadsheet: ' + file.name + ']';
          var xlsxText = /xlsx/i.test(k.ext) ? await extractXlsxText(buf) : null;
          if (xlsxText) return 'Spreadsheet "' + file.name + '":\n' + xlsxText;
          return '[Spreadsheet attached: ' + file.name + ' — binary spreadsheet container; parser could not extract rows. Convert to CSV for inline tables.]';
        }

        /* Text / code documents — straight FileReader.readAsText() */
        if (isTextLike(file)) {
          var txt = await readFileAsText(file);
          return 'File "' + file.name + '":\n' + txt;
        }

        var reader = new FileReader();
        return new Promise(function (resolve) {
          reader.onload = function (e) {
            var result = e.target.result;
            var lower = file.type.toLowerCase();

            if (lower.indexOf('image/') === 0) {
              resolve('[Image attached: ' + file.name + ']');
            } else if (lower === 'application/pdf') {
              try {
                var loadingTask = pdfjsLib.getDocument({ data: result });
                loadingTask.promise.then(function (pdf) {
                  var text = '';
                  var pageCount = pdf.numPages;
                  var pages = [];
                  for (var i = 1; i <= pageCount; i++) {
                    pages.push(pdf.getPage(i));
                  }
                  Promise.all(pages).then(function (pageResults) {
                    var getText = function (page) {
                      return page.getTextContent().then(function (tc) {
                        return tc.items.map(function (item) { return item.str; }).join('');
                      });
                    };
                    Promise.all(pageResults.map(getText)).then(function (texts) {
                      resolve(texts.join('\n\n'));
                    }).catch(function () { resolve('[Could not extract text from PDF]'); });
                  });
                }).catch(function () { resolve('[Could not parse PDF]'); });
              } catch (e) {
                resolve('[PDF parse error]');
              }
            } else if (lower === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
              try {
                var data = new Uint8Array(result.slice(0, result.length));
                if (window.mammoth) {
                  mammoth.extract_raw_text({ data: data }).then(function (r) {
                    resolve(r.value);
                  }).catch(function () { resolve('[Could not extract text from DOCX]'); });
                } else {
                  resolve('[Mammoth library not loaded]');
                }
              } catch (e) {
                resolve('[DOCX parse error]');
              }
            } else {
              resolve('[File: ' + file.name + ' (' + file.type + ', ' + formatFileSize(file.size) + ')]');
            }
          };
          reader.onerror = function () { resolve('[Error reading file]'); };

          if (file.type.indexOf('image/') === 0) {
            reader.readAsDataURL(file);
          } else if (file.type === 'application/pdf') {
            reader.readAsArrayBuffer(file);
          } else if (file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
            reader.readAsArrayBuffer(file);
          } else {
            reader.readAsText(file);
          }
        });
      }

      async function buildUserMessage(text) {
        var content = text;
        var attachments = pendingFiles.slice();

        if (attachments.length > 0) {
          var attachmentContexts = [];
          for (var i = 0; i < attachments.length; i++) {
            var f = attachments[i];
            var extracted = await extractFileText(f);
            if (extracted && extracted.indexOf('[') !== 0) {
              attachmentContexts.push('File "' + f.name + '":\n' + extracted);
            } else {
              attachmentContexts.push(extracted);
            }
          }
          content = text + '\n\n[Context from attached files:\n' + attachmentContexts.join('\n---\n') + '\n]';
        }
        return { role: 'user', content: content };
      }

      /* ===== Attached-file pills in the input bar (icon + quick ✕ remove) ===== */
      function extIcon(ext) {
        var map = {
          pdf: '📕', doc: '📘', docx: '📘', md: '📝', txt: '📄', rtf: '📄',
          csv: '📊', xlsx: '📊', xls: '📊', ods: '📊',
          json: '🧾', xml: '🧾', yml: '🧾', yaml: '🧾',
          js: '⚙️', mjs: '⚙️', cjs: '⚙️', ts: '⚙️', tsx: '⚙️', jsx: '⚙️',
          py: '🐍', rb: '💎', go: '🐹', rs: '🦀', java: '☕',
          html: '🌐', css: '🎨', scss: '🎨', svg: '🖼️', api: '🔌'
        };
        return map[String(ext).toLowerCase()] || '📎';
      }

      function renderFilePills() {
        if (!pillsBar) return;
        pillsBar.innerHTML = '';
        pendingFiles.forEach(function (file, idx) {
          var k = fileKey(file);
          var pill = document.createElement('span');
          pill.className = 'md-attach-pill';
          if (k.mime.indexOf('image/') === 0) {
            var img = document.createElement('img');
            img.className = 'md-attach-pill-thumb';
            img.src = URL.createObjectURL(file);
            img.alt = file.name;
            img.title = file.name;
            pill.appendChild(img);
          } else {
            var ic = document.createElement('span');
            ic.className = 'md-attach-pill-icon';
            ic.textContent = extIcon(k.ext);
            pill.appendChild(ic);
          }
          var name = document.createElement('span');
          name.className = 'md-attach-pill-name';
          name.textContent = file.name;
          name.title = file.name;
          pill.appendChild(name);
          var rm = document.createElement('button');
          rm.type = 'button';
          rm.className = 'md-attach-pill-remove';
          rm.setAttribute('aria-label', 'Remove ' + file.name);
          rm.innerHTML = '&times;';
          rm.addEventListener('click', (function (i) {
            return function () {
              pendingFiles.splice(i, 1);
              renderFilePills();
            };
          })(idx));
          pill.appendChild(rm);
          pillsBar.appendChild(pill);
        });
        pillsBar.style.display = pendingFiles.length ? 'flex' : 'none';
      }

      function clearPendingFiles() {
        pendingFiles = [];
        if (pillsBar) { pillsBar.innerHTML = ''; pillsBar.style.display = 'none'; }
      }

      function sendMessage() {
        var text = input ? input.value.trim() : '';
        if ((!text && pendingFiles.length === 0) || !chat) return;

        var welcome = document.getElementById('agent-welcome');
        if (welcome) welcome.style.display = 'none';

        if (window.MateyBehavior) MateyBehavior.record('user_prompt', { text: text });
        if (window.mateyCoach && typeof window.mateyCoach.recordPrompt === 'function') window.mateyCoach.recordPrompt(text);

        buildUserMessage(text).then(function (userMsg) {
          convHistory.push(userMsg);

          if (text) {
            chat.appendChild(createMsgBubble('agent-msg agent-user', text));
          }
          if (pendingFiles.length > 0) {
            pendingFiles.forEach(function (f) {
              var bubble = createMsgBubble('agent-msg agent-user', f.name + ' (' + formatFileSize(f.size) + ')');
              bubble.style.cssText = 'opacity:0.7;font-size:13px;';
              chat.appendChild(bubble);
            });
          }

          clearInput();
          clearPendingFiles();

          var resp = document.createElement('div');
          resp.className = 'agent-msg agent-reply';
          resp.innerHTML = '<img src="./images/matey-logo.png" class="ai-thinking-logo" alt="Thinking…" />';
          chat.appendChild(resp);
          scrollToBottom();

          if (!window.MateyByok) {
            resp.innerHTML = renderMarkdown('No BYOK provider configured. Add one in Settings → BYOK Models.');
            return;
          }

          try {
            // Use AgentOrchestrator (with tool calling) if available, otherwise fall back to plain chat
            if (window.MateyAgent && window.MateyAgent.AgentOrchestrator) {
              if (!window.mateyAgent) {
                var provider = window.MateyByok.getProvider('text');
                if (!provider) {
                  resp.innerHTML = renderMarkdown('No text provider configured. Add one in Settings → BYOK Models.');
                  return;
                }
                window.mateyAgent = new window.MateyAgent.AgentOrchestrator(provider);
              }
              resp.innerHTML = '<div style="opacity:0.7;">Agent is working... <span class="agent-thinking-dots">...</span></div>';
              // Live streaming (TASK 2): paint tokens into the bubble via rAF +
              // insertAdjacentText. NEVER innerHTML-per-token — that re-parses the
              // whole bubble every frame and freezes the UI thread.
              var liveEl = document.createElement('div');
              liveEl.className = 'mty-live-text';
              resp.appendChild(liveEl);
              var tokenBuf = '';
              var rafPending = false;
              function paintTokens() {
                rafPending = false;
                if (!tokenBuf) return;
                var text = tokenBuf;
                tokenBuf = '';
                var wrap = resp.firstChild;
                if (wrap && wrap.textContent && wrap.textContent.indexOf('Agent is working') !== -1) {
                  resp.removeChild(wrap);
                }
                liveEl.insertAdjacentText('beforeend', text);
                scrollToBottom();
              }
              var onAgentToken = function (t) {
                if (!t) return;
                tokenBuf += t;
                if (!rafPending) {
                  rafPending = true;
                  requestAnimationFrame(paintTokens);
                }
              };
              window.mateyAgent.executeTask(text, null, function (diff) {
                var d = document.createElement('div');
                d.className = 'mty-diff-line';
                d.textContent = '🔧 ' + (diff.search.substring(0, 60) || '') + '…';
                resp.appendChild(d);
                scrollToBottom();
              }, onAgentToken).then(function (result) {
                resp.innerHTML = renderMarkdown(result || 'Agent completed.');
                convHistory.push({ role: 'assistant', content: result || '' });
                var tid = window.mateyAgent._currentTaskId;
                if (tid && window.MateyWorkspaceManager && window.MateyWorkspaceManager.getTaskSnapshot && window.MateyWorkspaceManager.getTaskSnapshot(tid)) {
                  var undoBtn = document.createElement('button');
                  undoBtn.className = 'agent-undo-btn';
                  undoBtn.textContent = 'Undo Task Changes';
                  undoBtn.style.cssText = 'margin-top:8px;padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font-size:12px;cursor:pointer;opacity:0.8;';
                  undoBtn.addEventListener('click', function () {
                    if (!window.MateyWorkspaceManager || !window.MateyWorkspaceManager.rollbackTask) return;
                    var tid = window.mateyAgent ? window.mateyAgent._currentTaskId : null;
                    if (!tid) return;
                    window.MateyWorkspaceManager.rollbackTask(tid).then(function (ok) {
                      if (ok) {
                        undoBtn.textContent = 'Changes Reverted';
                        undoBtn.disabled = true;
                        undoBtn.style.opacity = '0.4';
                        if (window.AgentToast) { AgentToast.show('Workspace restored to pre-task snapshot.', false); }
                        else { alert('Workspace restored to pre-task snapshot.'); }
                      } else {
                        undoBtn.textContent = 'Nothing to Revert';
                        undoBtn.disabled = true;
                        undoBtn.style.opacity = '0.4';
                      }
                    });
                  });
                  resp.appendChild(document.createElement('br'));
                  resp.appendChild(undoBtn);
                }
                scrollToBottom();
              }).catch(function (err) {
                resp.innerHTML = renderMarkdown('Agent error: ' + (err.message || err));
                convHistory.push({ role: 'assistant', content: 'Agent error: ' + (err.message || err) });
              });
            } else {
            MateyByok.chat(convHistory).then(function (reply) {
              resp.innerHTML = renderMarkdown(reply || 'No response from provider.');
              convHistory.push({ role: 'assistant', content: reply || 'No response from provider.' });
            }).catch(function (err) {
              resp.innerHTML = renderMarkdown('Error: ' + (err.message || err));
              convHistory.push({ role: 'assistant', content: 'Error: ' + (err.message || err) });
            });
            }
          } catch (err) {
            resp.innerHTML = renderMarkdown('Error: ' + (err.message || err));
            convHistory.push({ role: 'assistant', content: 'Error: ' + (err.message || err) });
          }
        }).catch(function (err) {
          console.error('Send message error:', err);
        });
      }

      if (sendBtn) sendBtn.addEventListener('click', sendMessage);
      if (attachBtn && attachInput) {
        attachBtn.addEventListener('click', function () { attachInput.click(); });
        attachInput.addEventListener('change', function () {
          var files = Array.prototype.slice.call(this.files || []);
          files.forEach(function (file) {
            pendingFiles.push(file);
          });
          renderFilePills();
          this.value = '';
        });
      }
      if (input) {
        input.addEventListener('input', resizeTextarea);
        input.addEventListener('keypress', function (e) {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
      }
      // Voice input handled by matey-mic.js (loaded at line ~542) to avoid duplicate handlers

      if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.worker.min.js';
      }
    </script>
