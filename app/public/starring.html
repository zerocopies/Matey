<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; border: none; }
    </style>
    <meta name="theme-color" content="#000000" />
    <title>Matey - Starring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./matey-preview.css?v=4" />
    <script src="./matey-boot.js?v=4"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="header-top">
          <img class="matey-logo" src="./images/matey-logo.png" alt="Matey" />
          <div class="header-actions">
            <button class="icon-btn settings-trigger" type="button" aria-label="Settings"></button>
          </div>
        </div>
        <div class="greeting-row">
          <p class="greeting" id="greeting">Good evening</p>
          <span class="greeting-meta" id="greeting-meta"></span>
        </div>
        <div class="vibe-prompt" id="vibe-prompt"></div>
        <div class="usage-block">
          <div class="usage-row">
            <span>Usage</span>
            <span>65%</span>
          </div>
          <div class="usage-bar"><div class="usage-fill"></div></div>
        </div>
      </header>

      <nav class="tabs-wrap">
        <div class="tabs">
          <a class="tab active" href="./starring.html">Starring</a>
          <a class="tab" href="./hooks.html">Hooks</a>
          <a class="tab" href="./markdown.html">Markdown</a>
          <a class="tab" href="./preview.html#custom">Custom</a>
        </div>
      </nav>

      <main class="content">
        <div class="category-list">
          <div class="category-item">
            <div class="category-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></div>
            <div class="category-name">Grooming</div>
            <div class="category-arrow"></div>
          </div>
          <div class="category-item">
            <div class="category-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg></div>
            <div class="category-name">Wardrobe</div>
            <div class="category-arrow"></div>
          </div>
          <div class="category-item">
            <div class="category-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></div>
            <div class="category-name">Culinary</div>
            <div class="category-arrow"></div>
          </div>
          <div class="category-item">
            <div class="category-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></div>
            <div class="category-name">Lifestyle</div>
            <div class="category-arrow"></div>
          </div>
        </div>
      </main>
    </div>

    <div class="pull-hint" id="pull-hint"></div>

    <div class="chat-overlay" id="chat-overlay">
      <div class="chat-backdrop" id="chat-backdrop"></div>
      <div class="chat-dialog">
        <div class="chat-handle"></div>
        <div class="chat-dialog-input">
          <button class="chat-mic" type="button" aria-label="Voice"></button>
          <input type="text" class="chat-field" autocomplete="off" />
          <button class="chat-plus" type="button" aria-label="Add">+</button>
        </div>
        <div class="chat-dialog-body">
          <div class="chat-dialog-empty"></div>
        </div>
      </div>
    </div>
    <script src="./matey-themes.js?v=4"></script>
    <script src="./matey-swipe.js?v=4"></script>
    <script src="./matey-profile.js?v=4"></script>
    <script src="./matey-greet.js?v=4"></script>
    <script src="./matey-feed.js?v=4"></script>
    <script src="./matey-chat.js?v=4"></script>
    <script src="./matey-ai.js?v=4"></script>
    <script src="./matey-tabs.js?v=4"></script>
    <script src="./matey-byok.js?v=4"></script>
    <script src="./matey-syntax.js?v=4"></script>
    <script src="./matey-whisper.js?v=4"></script>
    <script src="./matey-pull.js?v=4"></script>
    <script src="./matey-rss.js?v=4"></script>
    <script src="./matey-license.js?v=4"></script>
    <script src="./matey-settings.js?v=4"></script>
    <script src="./matey-init.js?v=4"></script>

  </body>
</html>
