            </div>
            <div class="workspace-selector" id="workspace-selector"></div>
          </div>
          <div class="header-actions">
            <svg class="usage-ring" viewBox="0 0 36 36" id="usage-ring" aria-hidden="true"><circle class="usage-ring-track" cx="18" cy="18" r="15"></circle><g id="usage-ring-segments"><circle class="usage-ring-segment s1" cx="18" cy="18" r="15" stroke-dasharray="23.6 94.2" transform="rotate(0 18 18)"></circle><circle class="usage-ring-segment s2" cx="18" cy="18" r="15" stroke-dasharray="23.6 94.2" transform="rotate(90 18 18)"></circle><circle class="usage-ring-segment s3" cx="18" cy="18" r="15" stroke-dasharray="23.6 94.2" transform="rotate(180 18 18)"></circle><circle class="usage-ring-segment s4" cx="18" cy="18" r="15" stroke-dasharray="23.6 94.2" transform="rotate(270 18 18)"></circle></g><text x="18" y="21" text-anchor="middle" id="usage-ring-text">65</text></svg>
            <button class="incognito-trigger" type="button" aria-label="Incognito" title="Incognito">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3.5 0-6 2.5-6 6v9.5c0 .3.3.6.7.4l1.3-1 1.3 1c.4.3 1 .3 1.4 0l1.3-1 1.3 1c.4.3 1 .3 1.4 0l1.3-1 1.3 1c.4.2.7-.1.7-.4V9c0-3.5-2.5-6-6-6z"/><circle cx="9.5" cy="10" r="1.5"/><circle cx="14.5" cy="10" r="1.5"/></svg>
            </button>
            <button class="icon-btn settings-trigger" type="button" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <main class="md-page">
        <textarea class="md-editor md-editor-full" id="md-editor" placeholder="# Type freely — Markdown &amp; syntax supported&#10;&#10;** Permanent note — saved to vault&#10;## Scratchpad — auto-expires 24h&#10;// Silent automation&#10;?? Search your knowledge bank&#10;!! Priority flag&#10;&#10;Standard markdown formatting also works."></textarea>
        <div class="md-composer" id="md-composer">
          <div class="md-symbol-toolbar" id="md-symbol-toolbar">
            <button type="button" data-key="*">* </button>
            <button type="button" data-key="/">/</button>
            <button type="button" data-key="#"># </button>
            <button type="button" data-key="$">$</button>
            <button type="button" data-key="?">?</button>
            <button type="button" data-key="!">!</button>
            <button type="button" data-key="=">=</button>
            <button type="button" data-key="+">+</button>
            <button type="button" data-key="-">-</button>
            <button type="button" data-key="÷">÷</button>
            <button type="button" data-key="(">(</button>
            <button type="button" data-key=")">)</button>
          </div>
          <div class="md-compose-box">
            <input type="file" id="md-attach-input" accept="image/*,.pdf,.doc,.docx" style="display:none" />
            <button class="md-attach-btn" id="md-attach" type="button" aria-label="Attach file">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button class="md-voice-btn" id="md-voice" type="button" aria-label="Voice input">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <textarea class="md-compose-input" id="md-compose-input" autocomplete="off" placeholder="Type and press send..." rows="1"></textarea>
            <div class="md-compose-actions">
              <button class="md-send-btn" id="md-send" type="button" aria-label="Send">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="19" y1="12" x2="12" y2="5"></line><line x1="5" y1="12" x2="12" y2="5"></line></svg>
              </button>
            </div>
          </div>
        </div>

     <script src="./matey-md.js?v=74"></script>
    <script>
      var attachBtn = document.getElementById('md-attach');
      var attachInput = document.getElementById('md-attach-input');
      if (attachBtn && attachInput) {
        attachBtn.addEventListener('click', function () { attachInput.click(); });
        attachInput.addEventListener('change', function () {
          var file = this.files[0];
          if (!file) return;
          var el = document.querySelector('.md-attach-hint');
          if (!el) {
            el = document.createElement('div');
            el.className = 'md-attach-hint';
            el.style.cssText = 'font-size:12px;color:var(--accent);margin:4px 0;';
            attachBtn.parentNode.insertBefore(el, attachBtn.nextSibling);
          }
          el.textContent = 'Attached: ' + file.name + ' (' + Math.round(file.size/1024) + 'KB)';
          this.value = '';
        });
      }
    </script>
    <script>
      var voiceBtn = document.getElementById('md-voice');
      var mInput = document.getElementById('md-compose-input');
      var recognizing = false;
      var recognition;
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR) {
        recognition = new SR();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        recognition.onresult = function (e) {
          var finals = '';
          for (var i = e.resultIndex; i < e.results.length; i++) {
            var t = e.results[i][0].transcript;
            if (e.results[i].isFinal) finals += t;
            else if (mInput) mInput.value += t;
          }
          if (finals && mInput) mInput.value += finals;
        };
        recognition.onerror = function () { recognizing = false; if (voiceBtn) voiceBtn.style.opacity = ''; };
        recognition.onend = function () { recognizing = false; if (voiceBtn) voiceBtn.style.opacity = ''; };
      }
      if (voiceBtn && recognition) {
        voiceBtn.addEventListener('click', function () {
          if (recognizing) { recognition.stop(); recognizing = false; voiceBtn.style.opacity = ''; }
          else { if (mInput) mInput.focus(); recognizing = true; voiceBtn.style.opacity = '0.5'; recognition.start(); }
        });
      } else if (voiceBtn) { voiceBtn.style.display = 'none'; }
    </script>
