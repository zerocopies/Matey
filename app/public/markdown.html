<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; border: none; display: flex; flex-direction: column; }
    </style>
    <meta name="theme-color" content="#000000" />
    <title>Matey - Markdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./matey-preview.css?v=4" />
    <script src="./matey-boot.js?v=4"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="header-top">
          <img class="matey-logo" src="./images/matey-logo.png" alt="Matey" />
          <div class="header-actions">
            <button class="icon-btn settings-trigger" type="button" aria-label="Settings"></button>
          </div>
        </div>
        <div class="greeting-row">
          <p class="greeting" id="greeting">Good evening</p>
          <span class="greeting-meta" id="greeting-meta"></span>
        </div>
        <div class="vibe-prompt" id="vibe-prompt"></div>
        <div class="usage-block">
          <div class="usage-row"><span>Usage</span><span>65%</span></div>
          <div class="usage-bar"><div class="usage-fill"></div></div>
        </div>
      </header>

      <nav class="tabs-wrap">
        <div class="tabs">
          <a class="tab" href="./starring.html">Starring</a>
          <a class="tab" href="./hooks.html">Hooks</a>
          <a class="tab active" href="./markdown.html">Markdown</a>
          <a class="tab" href="./preview.html#custom">Custom</a>
        </div>
      </nav>

      <main class="md-page">
        <textarea class="md-editor md-editor-full" id="md-editor" placeholder="# Type freely — Markdown &amp; syntax supported&#10;&#10;** Permanent note — saved to vault&#10;## Scratchpad — auto-expires 24h&#10;// Silent automation&#10;?? Search your knowledge bank&#10;!! Priority flag&#10;&#10;Standard markdown formatting also works."></textarea>
      </main>
    </div>
    <script src="./matey-themes.js?v=4"></script>
    <script src="./matey-swipe.js?v=4"></script>
    <script src="./matey-profile.js?v=4"></script>
    <script src="./matey-greet.js?v=4"></script>
    <script src="./matey-feed.js?v=4"></script>
    <script src="./matey-chat.js?v=4"></script>
    <script src="./matey-ai.js?v=4"></script>
    <script src="./matey-md.js?v=4"></script>
    <script src="./matey-byok.js?v=4"></script>
    <script src="./matey-syntax.js?v=4"></script>
    <script src="./matey-whisper.js?v=4"></script>
    <script src="./matey-pull.js?v=4"></script>
    <script src="./matey-rss.js?v=4"></script>
    <script src="./matey-license.js?v=4"></script>
    <script src="./matey-settings.js?v=4"></script>
    <script src="./matey-init.js?v=4"></script>
    <script src="./matey-tabs.js?v=4"></script>

  </body>
</html>
