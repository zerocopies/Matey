<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; display: flex; flex-direction: column; }
    </style>
    <meta name="description" content="Matey — your on-device personal AI assistant with BYOK AI providers, offline Whisper STT, encrypted journal, and syntax-driven note vault." />
    <link rel="icon" href="./images/matey-logo.png" type="image/png" />
    <meta name="theme-color" content="#000000" />
    <title>Matey - .EDITOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="./version.js"></script>
    <script>
      document.write('<link rel="stylesheet" href="./matey-preview.css?v=' + MATEY_CSS_VERSION + '">');
    </script>
    <script src="./matey-boot.js?v=100"></script>
    <script src="./matey-sentry.js?v=100"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="header-top">
          <img class="matey-logo" src="./images/matey-logo.png" alt="Matey" />
          <div class="workspace-display-container" id="workspace-display-container">
            <div class="workspace-dropdown" id="workspace-dropdown">
              <span class="workspace-name" id="workspace-display">Workspace</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="workspace-selector" id="workspace-selector"></div>
          </div>
          <div class="header-actions">
            <svg class="usage-ring" viewBox="0 0 36 36" id="usage-ring" aria-hidden="true"><circle class="usage-ring-track" cx="18" cy="18" r="15"></circle><g id="usage-ring-segments"><circle class="usage-ring-segment s1" cx="18" cy="18" r="15" stroke-dasharray="23.6 94.2" transform="rotate(0 18 18)"></circle><circle class="usage-ring-segment s2" cx="18" cy="18" r="15" stroke-dasharray="23.6 94.2" transform="rotate(90 18 18)"></circle><circle class="usage-ring-segment s3" cx="18" cy="18" r="15" stroke-dasharray="23.6 94.2" transform="rotate(180 18 18)"></circle><circle class="usage-ring-segment s4" cx="18" cy="18" r="15" stroke-dasharray="23.6 94.2" transform="rotate(270 18 18)"></circle></g><text x="18" y="21" text-anchor="middle" id="usage-ring-text">65</text></svg>
            <button class="incognito-trigger" type="button" aria-label="Incognito" title="Incognito">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3.5 0-6 2.5-6 6v9.5c0 .3.3.6.7.4l1.3-1 1.3 1c.4.3 1 .3 1.4 0l1.3-1 1.3 1c.4.3 1 .3 1.4 0l1.3-1 1.3 1c.4.2.7-.1.7-.4V9c0-3.5-2.5-6-6-6z"/><circle cx="9.5" cy="10" r="1.5"/><circle cx="14.5" cy="10" r="1.5"/></svg>
            </button>
            <button class="icon-btn settings-trigger" type="button" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg></button>
          </div>
        </div>
      </header>

            <nav class="tabs-wrap" id="tabs-wrap">
        <div class="tabs">
          <a class="tab" href="./lifestyle.html">Lifestyle</a>
          <a class="tab" href="./vots.html">My-VOTS</a>
          <a class="tab active" href="./markdown.html">.EDITOR</a>
          <a class="tab" href="./journal.html">Journal</a>
          <a class="tab" href="./preview.html#agent">Agent</a>
        </div>
      </nav>

<main class="md-page">
        <textarea class="md-editor md-editor-full" id="md-editor" placeholder="# Type freely — Markdown & syntax supported&#10;&#10;** Permanent note — saved to vault&#10;## Scratchpad — auto-expires 24h&#10;// Silent automation&#10;?? Search your knowledge bank&#10;!! Priority flag&#10;&#10;Standard markdown formatting also works."></textarea>
        <div class="md-attachment-list" id="md-attachment-list"></div>
        <!-- Composer toolbar: shared edit/symbol/mic toolbar (injected by matey-toolbar.js) -->
        <div class="md-composer md-composer-symbols-only matey-toolbar-container" id="md-composer"></div>
        <!-- File operations row (New, Open, Save, Save As, Attach) - stays unchanged -->
        <div class="md-composer-actions">
          <button type="button" class="md-toolbar-btn" id="md-new-btn" aria-label="New file" title="New file" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);color:var(--text);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          </button>
          <button type="button" class="md-toolbar-btn" id="md-open-btn" aria-label="Open file" title="Open file" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);color:var(--text);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          </button>
          <button type="button" class="md-toolbar-btn" id="md-save-btn" aria-label="Save" title="Save" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);color:var(--text);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><line x1="7" y1="21" x2="7" y2="9"/></svg>
          </button>
          <button type="button" class="md-toolbar-btn" id="md-saveas-btn" aria-label="Save as" title="Save as" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);color:var(--text);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          </button>
          <button type="button" class="md-file-btn" id="md-attach-btn" aria-label="Attach file" title="Attach file">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
          </button>
        </div>
      </main>
    </div>
    <script src="./matey-themes.js?v=100"></script>
    <script src="./matey-swipe.js?v=100"></script>
    <script src="./matey-profile.js?v=100"></script>
     <script src="./matey-greet.js?v=100"></script>
     <script src="./matey-feed.js?v=100"></script>
     <script src="./matey-ai.js?v=100"></script>
<script src="./matey-fs-adapter.js?v=100"></script>
      <script src="./matey-toolbar.js?v=100"></script>
       <script src="./matey-md.js?v=100"></script>
     <script src="./matey-byok.js?v=100"></script>
    <script src="./matey-beat.js?v=100"></script>
    <script src="./matey-lifestyle.js?v=100"></script>
    <script src="./matey-syntax.js?v=100"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.2/mammoth.min.js"></script>
    <script src="./matey-whisper.js?v=100"></script>
    <script src="./matey-models.js?v=100"></script>
<script src="./matey-rss.js?v=100"></script>
    <script src="./matey-license.js?v=100"></script>
    <script src="./matey-settings.js?v=100"></script>
    <script src="./matey-recall.js?v=100"></script>
    <script src="./matey-behavior.js?v=100"></script>
    <script type="module">import { mateyCoach } from './matey-coach.js'; window.mateyCoach = mateyCoach;</script>
    <script src="./matey-adaptive.js?v=100"></script>
    <script src="./matey-init.js?v=100"></script>
    <script src="./matey-tabs.js?v=100"></script>
    <script src="./matey-keyboard.js?v=100"></script>
    <script src="./matey-mic.js?v=100"></script>
    <script src="./matey-fs.js?v=100"></script>
    <script src="./matey-hooks-manager.js?v=100"></script>

  </body>
</html>
