      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; }
    </style>
    <script>
      /* Instant matte background — set --app-bg before first paint so the
         html { background-color: var(--app-bg) !important } rule resolves
         to the themed color immediately. No white flash. */
      try {
        var _bgs = { graphitexx: '#000000', 'cool-panda': '#1a1d23', minimal: '#fafafa' };
        var _t = localStorage.getItem('matey-theme') || 'graphitexx';
        var _bg = _bgs[_t] || _bgs.graphitexx;
        document.documentElement.style.setProperty('--app-bg', _bg);
        document.documentElement.style.backgroundColor = _bg;
      } catch (e) {}
    </script>

  <script>
    (function() {
      /* Logo -> home */
      var logo = document.querySelector(".matey-logo");
      if (logo && !logo._wired) {
        logo._wired = true;
        logo.style.cursor = "pointer";
        logo.addEventListener("click", function() {
          window.location.href = "./index.html";
        });
      }

      /* Workspace folder -> open picker */
      var folderBtn = document.querySelector(".workspace-folder-btn");
      if (folderBtn && !folderBtn._wired) {
        folderBtn._wired = true;
        folderBtn.addEventListener("click", function(e) {
          e.preventDefault();
          if (window.MateyFS && MateyFS.selectWorkspace) {
            MateyFS.selectWorkspace();
          }
        });
      }

      /* IDE badge -> focus editor if present */
      var ideBadge = document.querySelector(".ide-text-badge");
      if (ideBadge && !ideBadge._wired) {
        ideBadge._wired = true;
        ideBadge.addEventListener("click", function() {
          var editor = document.querySelector("#edit-editor-container, #md-ide-container");
          if (editor) {
            editor.scrollIntoView({ behavior: "smooth", block: "center" });
          } else {
            alert("IDE mode active on this screen");
          }
        });
      }

      /* Status circle -> toggle usage demo */
      var statusCircle = document.querySelector(".status-circle");
      if (statusCircle && !statusCircle._wired) {
        statusCircle._wired = true;
        var usageOn = true;
        statusCircle.addEventListener("click", function() {
          usageOn = !usageOn;
          if (window.MateyUsage && MateyUsage.update) {
            MateyUsage.update(usageOn ? 100 : 0);
          }
          statusCircle.style.opacity = usageOn ? "1" : "0.5";
        });
      }

      /* Burger menu -> toggle settings overlay if present */
      var burgerBtns = document.querySelectorAll(".burger-menu-btn");
      burgerBtns.forEach(function(btn) {
        if (btn._wired) return;
        btn._wired = true;
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          var settings = document.getElementById("settings");
          if (settings) {
            var willOpen = !settings.classList.contains("open");
            settings.classList[willOpen ? "add" : "remove"]("open");
            if (willOpen && window.MateyThemes && MateyThemes.build) {
              MateyThemes.build(settings);
            }
          } else {
            alert("Menu tapped");
          }
        });
      });
    })();
  </script>
