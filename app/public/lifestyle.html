<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; }
    </style>
    <script>
      /* Instant matte background — set --app-bg before first paint so the
         html { background-color: var(--app-bg) !important } rule resolves
         to the themed color immediately. No white flash. */
      try {
        var _bgs = { graphitexx: '#000000', 'cool-panda': '#1a1d23', minimal: '#fafafa' };
        var _t = localStorage.getItem('matey-theme') || 'graphitexx';
        var _bg = _bgs[_t] || _bgs.graphitexx;
        document.documentElement.style.setProperty('--app-bg', _bg);
        document.documentElement.style.backgroundColor = _bg;
      } catch (e) {}
    </script>
    <meta name="description" content="Matey — your on-device personal AI assistant with BYOK AI providers, offline Whisper STT, encrypted journal, and syntax-driven note vault." />
    <link rel="icon" href="./images/matey-logo.png" type="image/png" />
    <meta name="theme-color" content="#000000" />
    <title>Matey - Lifestyle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="./version.js"></script>
    <script>
      document.write('<link rel="stylesheet" href="./matey-preview.css?v=' + MATEY_CSS_VERSION + '">');
    </script>
    <script src="./matey-boot.js?v=100"></script>
    <script src="./matey-sentry.js?v=100"></script>
  </head>
<body>

          <button id="workspace-folder-btn" class="workspace-folder-btn" title="Select Workspace">📁</button>
          <div class="id-icon" title="ID Badge">🪪</div>
        </div>

        <!-- RIGHT GROUP -->
        <div class="header-actions">
          <div class="usage-ring" title="Token Meter"></div>
          <button id="lux-theme-toggle" class="theme-toggle-btn" title="Theme Palette">🎨</button>
          <div id="vault-launcher" class="vault-btn" title="Storage Vault">🗄️</div>
          <div class="incognito-trigger" title="Incognito">👻</div>
          <button class="menu-btn" title="Menu">☰</button>
        </div>
      </header>

            <nav class="tabs-wrap" id="tabs-wrap">
