<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
      .app-shell { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; display: flex; flex-direction: column; }
    </style>
    <meta name="description" content="Matey — your on-device personal AI assistant with BYOK AI providers, offline Whisper STT, encrypted journal, and syntax-driven note vault." />
    <meta name="page-type" content="journal" />
    <link rel="icon" href="./images/matey-logo.png" type="image/png" />
    <meta name="theme-color" content="#000000" />
    <title>Matey - Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="./version.js"></script>
    <script>
      document.write('<link rel="stylesheet" href="./matey-preview.css?v=' + MATEY_CSS_VERSION + '">');
    </script>
    <script src="./matey-boot.js?v=100"></script>
    <script src="./matey-sentry.js?v=100"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="header-top">
          <img class="matey-logo" src="./images/matey-logo.png" alt="Matey" />
          <div class="workspace-display-container" id="workspace-display-container">
            <div class="workspace-dropdown" id="workspace-dropdown">
              <span class="workspace-name" id="workspace-display">Workspace</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="workspace-selector" id="workspace-selector"></div>
          </div>
          <div class="header-actions">
            <svg class="usage-ring" viewBox="0 0 36 36" id="usage-ring" aria-hidden="true"><circle class="usage-ring-track" cx="18" cy="18" r="15"></circle><path class="usage-ring-segment" d="" /></svg>
            <button class="incognito-trigger" type="button" aria-label="Incognito" title="Incognito">
              <svg class="incognito-ghost" viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path class="ghost-body" d="M 50 4 C 20 4 5 28 5 52 L 5 92 C 5 105 15 105 20 98 C 25 105 35 105 40 98 C 45 105 55 105 60 98 C 65 105 75 105 80 98 C 85 105 95 105 95 92 L 95 52 C 95 28 80 4 50 4 Z"/>
                <ellipse class="ghost-eye" cx="35" cy="50" rx="10" ry="15"/>
                <ellipse class="ghost-pupil" cx="35" cy="52" rx="4" ry="8"/>
                <ellipse class="ghost-eye" cx="65" cy="50" rx="10" ry="15"/>
                <ellipse class="ghost-pupil" cx="65" cy="52" rx="4" ry="8"/>
                <path class="ghost-eyebrow" d="M 26 34 L 38 40"/>
                <path class="ghost-eyebrow" d="M 74 34 L 62 40"/>
                <path class="ghost-mouth" d="M 38 78 Q 50 94 62 78 Q 50 88 38 78 Z"/>
                <path class="ghost-teeth" d="M 40 80 L 43 85 L 46 80 L 49 85 L 52 80 L 55 85 L 58 80 L 60 82"/>
              </svg>
            </button>
            <button class="icon-btn settings-trigger" type="button" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg></button>
          </div>
        </div>
      </header>

      <nav class="tabs-wrap" id="tabs-wrap">
        <div class="tabs">
          <a class="tab" href="./lifestyle.html">Lifestyle</a>
          <a class="tab" href="./vots.html">My-VOTS</a>
          <a class="tab" href="./raw-editor.html">&gt;edit</a>
          <a class="tab active" href="./journal.html">Journal</a>
          <a class="tab" href="./preview.html#agent">&gt;agent</a>
        </div>
      </nav>

      <div class="tab-border" style="height:1px;background:#1a1a1a;width:100%"></div>

      <main class="journal-page" id="journal-page">
        <!-- Lock Screen -->
        <div class="journal-lock-screen" id="journal-lock-screen" style="display:none">
          <div class="journal-lock-content">
            <div class="journal-lock-icon">🔒</div>
            <h2 class="journal-lock-title">Journal Locked</h2>
            <p class="journal-lock-desc">Enter your PIN to unlock your encrypted journal</p>
            <input type="password" id="journal-pin-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••" />
            <button class="journal-btn journal-btn-primary" id="journal-unlock-btn" type="button">Unlock</button>
            <button class="journal-btn journal-btn-secondary" id="journal-setup-lock-btn" type="button" style="display:none">Set Up Journal PIN</button>
          </div>
        </div>

        <!-- Journal Main -->
      <div class="journal-main" id="journal-main" style="display:none">
        <!-- Entries List -->
        <div class="journal-entries" id="journal-entries">
          <p class="journal-empty-state">No entries yet.</p>
        </div>

        <!-- New Entry FAB -->
        <button class="journal-fab" id="journal-new-entry-btn" type="button" title="New entry">
          <span class="journal-fab-icon">+</span>
        </button>
      </div>

        <!-- New/Edit Entry Form -->
        <div class="journal-entry-form" id="journal-entry-form" style="display:none">
          <!-- Title row: title input (flex-grow) + Save button + ⋮ menu -->
          <div class="journal-title-row" id="journal-title-row">
            <input type="text" class="journal-title-input" id="journal-title-input" placeholder="Enter the title..." />
            <button class="journal-btn journal-btn-sm journal-save-btn" id="journal-save-btn" type="button" title="Save entry">Save</button>
            <button class="journal-btn journal-btn-sm journal-header-menu-btn" id="journal-header-menu-btn" type="button" title="More">⋮</button>
          </div>

          <!-- Auto-generated date/time (not editable) -->
          <div class="journal-datetime" id="journal-datetime"></div>

          <!-- Main content textarea -->
          <div class="journal-content-wrapper" id="journal-content-wrapper">
            <textarea class="journal-content-input" id="journal-content-input" placeholder="What's on your mind?" rows="8"></textarea>
            <input type="file" id="journal-attach-input" accept="image/*" style="display:none" />
            <div class="journal-attachments" id="journal-attachments"></div>
          </div>

          <!-- Attachment dropdown menu -->
          <div class="journal-attach-menu" id="journal-attach-menu" style="display:none">
            <button class="journal-menu-item" id="journal-add-image" type="button">📷 Photo</button>
            <button class="journal-menu-item" id="journal-add-file" type="button">📄 File</button>
            <button class="journal-menu-item" id="journal-add-location" type="button">📍 Location</button>
          </div>
        </div>

        <!-- Three-dot menu dropdown (screen-level) -->
        <div class="journal-three-dot-menu" id="journal-three-dot-menu" style="display:none">
          <button class="journal-menu-item" id="journal-save-as-btn" type="button">💾 Save as</button>
          <button class="journal-menu-item" id="journal-delete-entry" type="button">🗑️ Delete</button>
        </div>
      </main>

      <!-- Symbol toolbar only — no chat box; keyboard symbols insert into active text input -->
      <!-- Shared edit/symbol/mic toolbar (injected by matey-toolbar.js) -->
      <div class="md-composer md-composer-symbols-only journal-toolbar matey-toolbar-container" id="md-composer"></div>
     </div>
    </div>

    <script src="./matey-swipe.js?v=100"></script>

    <script src="./matey-byok.js?v=100"></script>
    <script src="./matey-agent-harness.js?v=100"></script>
    <script src="./matey-beat.js?v=100"></script>
    <script src="./matey-lifestyle.js?v=100"></script>
    <script src="./matey-syntax.js?v=100"></script>
    <script src="./matey-whisper.js?v=100"></script>
    <script src="./matey-stt.js?v=100"></script>
    <script src="./matey-models.js?v=100"></script>
    <script src="./matey-journal.js?v=100"></script>
    <script src="./matey-rss.js?v=100"></script>
    <script src="./matey-license.js?v=100"></script>
    <script src="./matey-settings.js?v=100"></script>
    <script src="./matey-recall.js?v=100"></script>
    <script src="./matey-behavior.js?v=100"></script>
    <script type="module">import { mateyCoach } from './matey-coach.js'; window.mateyCoach = mateyCoach;</script>
    <script src="./matey-adaptive.js?v=100"></script>
    <script src="./matey-init.js?v=100"></script>
    <script src="./matey-tabs.js?v=100"></script>
    <script src="./matey-keyboard.js?v=100"></script>
    <script src="./matey-mic.js?v=100"></script>
    <script src="./matey-toolbar.js?v=100"></script>
    <script src="./matey-fs.js?v=100"></script>

    <script src="./matey-hooks-manager.js?v=100"></script>
    <script>
      (function () {
        'use strict';
        var lockScreen = document.getElementById('journal-lock-screen');
        var journalMain = document.getElementById('journal-main');
        var pinInput = document.getElementById('journal-pin-input');
        var unlockBtn = document.getElementById('journal-unlock-btn');
        var setupBtn = document.getElementById('journal-setup-lock-btn');
        var entriesEl = document.getElementById('journal-entries');
        var entryForm = document.getElementById('journal-entry-form');
        var titleInput = document.getElementById('journal-title-input');
        var datetimeEl = document.getElementById('journal-datetime');
        var contentInput = document.getElementById('journal-content-input');
        var attachInput = document.getElementById('journal-attach-input');
        var attachmentsEl = document.getElementById('journal-attachments');
        var saveBtn = document.getElementById('journal-save-btn');
        var newEntryBtn = document.getElementById('journal-new-entry-btn');
        var attachMenu = document.getElementById('journal-attach-menu');
        var headerMenuBtn = document.getElementById('journal-header-menu-btn');
        var threeDotMenu = document.getElementById('journal-three-dot-menu');
        var saveAsBtn = document.getElementById('journal-save-as-btn');
        var deleteEntryBtn = document.getElementById('journal-delete-entry');
        var addImageBtn = document.getElementById('journal-add-image');
        var addFileBtn = document.getElementById('journal-add-file');
        var addLocationBtn = document.getElementById('journal-add-location');

        var currentEditId = null;
        var currentAttachments = [];

        function escapeHtml(s) {
          return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function formatDate(ts) {
          var d = new Date(ts);
          var now = Date.now();
          var diff = now - ts;
          if (diff < 86400000) return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
          if (diff < 86400000 * 7) return d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
          return d.toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'});
        }

        function renderEntries() {
          MateyJournal.getEntries().then(function (entries) {
            if (!entries.length) {
              entriesEl.innerHTML = '<p class="journal-empty-state">No entries yet.</p>';
              return;
            }
            entriesEl.innerHTML = entries.map(function (e) {
              var preview = (e.content || '').substring(0, 120);
              if (e.content && e.content.length > 120) preview += '\u2026';
              var hasAttachments = e.attachments && e.attachments.length;
              return '<div class="journal-entry-card list-card" data-id="' + e.id + '">' +
                '<div class="journal-entry-date">' + formatDate(e.createdAt) + '</div>' +
                '<div class="journal-entry-title">' + escapeHtml(e.title || 'Untitled') + '</div>' +
                '<div class="journal-entry-preview">' + escapeHtml(preview) + '</div>' +
                (hasAttachments ? '<div class="journal-entry-count">' + hasAttachments + '</div>' : '') +
              '</div>';
            }).join('');
            entriesEl.querySelectorAll('.journal-entry-card').forEach(function (card) {
              card.addEventListener('click', function () {
                var id = card.getAttribute('data-id');
                loadEntryIntoView(id);
              });
            });
          }).catch(function (e) {
            entriesEl.innerHTML = '<p class="journal-empty-state">Error loading entries.</p>';
          });
        }

        function getDateTimeTitle() {
          var d = new Date();
          var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
          var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
          var dayName = days[d.getDay()];
          var monthName = months[d.getMonth()];
          var date = d.getDate();
          var hours = d.getHours();
          var minutes = d.getMinutes();
          var ampm = hours >= 12 ? 'PM' : 'AM';
          hours = hours % 12;
          if (hours === 0) hours = 12;
          if (minutes < 10) minutes = '0' + minutes;
          return dayName + ', ' + monthName + ' ' + date + ' \u00b7 ' + hours + ':' + minutes + ' ' + ampm;
        }

        function updateDateTimeDisplay() {
          if (datetimeEl) datetimeEl.textContent = getDateTimeTitle();
        }

        function loadEntryIntoView(id) {
          MateyJournal.getEntry(id).then(function (entry) {
            if (!entry) return;
            currentEditId = id;
            titleInput.value = entry.title || '';
            contentInput.value = entry.content || '';
            currentAttachments = entry.attachments || [];
            updateDateTimeDisplay();
            entryForm.style.display = 'flex';
            journalMain.style.display = 'none';
            if (newEntryBtn) newEntryBtn.classList.add('hidden');
            renderAttachmentList();
          });
        }

        function hideEntryForm() {
          saveEntry();
          entryForm.style.display = 'none';
          journalMain.style.display = 'flex';
          if (newEntryBtn) newEntryBtn.classList.remove('hidden');
          currentEditId = null;
          if (attachMenu) attachMenu.style.display = 'none';
          if (threeDotMenu) threeDotMenu.style.display = 'none';
          if (headerMenuBtn) headerMenuBtn.classList.remove('menu-active');
        }

        function showNewEntryForm() {
          currentEditId = null;
          titleInput.value = '';
          contentInput.value = '';
          currentAttachments = [];
          updateDateTimeDisplay();
          entryForm.style.display = 'flex';
          journalMain.style.display = 'none';
        }

        function saveEntry() {
          var title = titleInput.value.trim() || getDateTimeTitle();
          var content = contentInput.value;

          if (currentEditId) {
            MateyJournal.updateEntry(currentEditId, {
              title: title,
              content: content,
              attachments: currentAttachments
            }).then(function () {
              renderEntries();
            });
          } else {
            MateyJournal.createEntry(title, content, [], currentAttachments).then(function () {
              renderEntries();
            });
          }
        }

        function setupLockUI() {
          var locked = MateyJournal.isLocked();
          if (locked) {
            lockScreen.style.display = 'flex';
            journalMain.style.display = 'none';
          } else {
            lockScreen.style.display = 'none';
            journalMain.style.display = 'block';
            showNewEntryForm();
          }
        }

        if (unlockBtn) {
          unlockBtn.addEventListener('click', function () {
            var pin = pinInput.value;
            if (!pin) {
              if (setupBtn.style.display !== 'none') {
                var newPin = prompt('Set a 4-digit PIN for your journal:');
                if (newPin && newPin.length >= 4) {
                  MateyJournal.setLock(pin || newPin).then(function () {
                    pinInput.value = '';
                    setupLockUI();
                  });
                }
                return;
              }
              alert('Please enter your PIN');
              return;
            }
            MateyJournal.unlock(pin).then(function (valid) {
              if (valid) {
                pinInput.value = '';
                lockScreen.style.display = 'none';
                journalMain.style.display = 'block';
                showNewEntryForm();
              } else {
                pinInput.value = '';
                alert('Incorrect PIN');
              }
            });
          });
        }

        if (setupBtn) {
          setupBtn.addEventListener('click', function () {
            var pin = prompt('Set a 4-digit PIN for your journal:');
            if (pin && pin.length >= 4) {
              MateyJournal.setLock(pin).then(function () {
                setupLockUI();
              });
            }
          });
        }

        if (pinInput) {
          pinInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              unlockBtn.click();
            }
          });
        }

         if (saveBtn) {
          saveBtn.addEventListener('click', function () {
            saveEntry();
          });
        }

        if (newEntryBtn) {
          newEntryBtn.addEventListener('click', function () {
            showNewEntryForm();
          });
        }

        if (headerMenuBtn && attachMenu) {
          headerMenuBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            attachMenu.style.display = attachMenu.style.display === 'block' ? 'none' : 'block';
            if (threeDotMenu) threeDotMenu.style.display = 'none';
          });
        }

        if (addImageBtn && attachInput) {
          addImageBtn.addEventListener('click', function () {
            attachInput.accept = 'image/*';
            attachInput.click();
            if (attachMenu) attachMenu.style.display = 'none';
          });
        }

        if (addFileBtn && attachInput) {
          addFileBtn.addEventListener('click', function () {
            attachInput.accept = 'file/*';
            attachInput.click();
            if (attachMenu) attachMenu.style.display = 'none';
          });
        }

        if (addLocationBtn) {
          addLocationBtn.addEventListener('click', function () {
            navigator.geolocation.getCurrentPosition(function (pos) {
              var loc = 'https://maps.google.com/?q=' + pos.coords.latitude + ',' + pos.coords.longitude;
              currentAttachments.push({
                id: loc,
                name: 'Location: ' + pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4),
                size: 0,
                type: 'text/location'
              });
              renderAttachmentList();
            }, function () {
              alert('Location permission denied');
            });
            if (attachMenu) attachMenu.style.display = 'none';
          });
        }

        if (headerMenuBtn && threeDotMenu) {
          headerMenuBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            threeDotMenu.style.display = threeDotMenu.style.display === 'block' ? 'none' : 'block';
            if (attachMenu) attachMenu.style.display = 'none';
            headerMenuBtn.classList.toggle('menu-active');
          });
        }

        if (saveAsBtn) {
          saveAsBtn.addEventListener('click', async function () {
            if (threeDotMenu) threeDotMenu.style.display = 'none';
            if (headerMenuBtn) headerMenuBtn.classList.remove('menu-active');

            var title = titleInput.value.trim() || 'journal-entry';
            var safeName = title.replace(/[^a-zA-Z0-9\-_ ]/g, '').trim().replace(/\s+/g, '-');
            if (!safeName) safeName = 'journal-entry';
            var defaultName = safeName + '.md';

            var filename = prompt('Enter filename:', defaultName);
            if (!filename) return;
            if (!filename.toLowerCase().endsWith('.md')) filename += '.md';

            var content = (titleInput.value.trim() + '\n\n' + contentInput.value).trim();

            try {
              if (window.MateyFS && MateyFS.supports()) {
                await MateyFS.writeFile(filename, content);
                alert('Saved as ' + filename);
              } else if (window.MateyFSAdapter && MateyFSAdapter.saveAsFile) {
                var result = await MateyFSAdapter.saveAsFile(content, {
                  filename: filename,
                  mimeType: 'text/plain'
                });
                if (result && result.ok) {
                  alert('Saved as ' + filename);
                } else {
                  alert('Save failed: ' + (result.error || 'unknown error'));
                }
              } else {
                var a = document.createElement('a');
                a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(content);
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(function () { document.body.removeChild(a); }, 100);
                alert('Downloaded ' + filename);
              }
            } catch (e) {
              if (e && e.name === 'AbortError') return;
              alert('Save failed: ' + (e.message || String(e)));
            }
          });
        }

        if (deleteEntryBtn) {
          deleteEntryBtn.addEventListener('click', function () {
            if (currentEditId && confirm('Delete this entry?')) {
              MateyJournal.deleteEntry(currentEditId).then(function () {
                if (threeDotMenu) threeDotMenu.style.display = 'none';
                if (headerMenuBtn) headerMenuBtn.classList.remove('menu-active');
                hideEntryForm();
                renderEntries();
              });
            }
          });
        }

        document.addEventListener('click', function () {
          if (attachMenu) attachMenu.style.display = 'none';
          if (threeDotMenu) threeDotMenu.style.display = 'none';
          if (headerMenuBtn) headerMenuBtn.classList.remove('menu-active');
        });

        if (attachInput) {
          attachInput.addEventListener('change', function () {
            var files = this.files;
            if (!files || !files.length) return;
            Array.from(files).forEach(function (file) {
              var reader = new FileReader();
              reader.onload = function (e) {
                var dataUrl = e.target.result;
                currentAttachments.push({
                  id: dataUrl,
                  name: file.name,
                  size: file.size,
                  type: file.type
                });
                renderAttachmentList();
              };
              reader.readAsDataURL(file);
            });
            this.value = '';
          });
        }

        function renderAttachmentList() {
          attachmentsEl.innerHTML = currentAttachments.map(function (a, i) {
            var isImage = a.type && a.type.indexOf('image/') === 0;
            if (isImage) {
              return '<img src="' + a.id + '" class="journal-attachment-thumb" />' +
                     '<button class="journal-attachment-remove" data-index="' + i + '">✕</button>';
            }
            return '<div class="journal-attachment-name">' + escapeHtml(a.name) + '</div>' +
                   '<button class="journal-attachment-remove" data-index="' + i + '">✕</button>';
          }).join('');
          attachmentsEl.querySelectorAll('.journal-attachment-remove').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var idx = parseInt(btn.getAttribute('data-index'), 10);
              currentAttachments.splice(idx, 1);
              renderAttachmentList();
            });
          });
        }

        // Auto-save on input change (500ms debounce)
        var saveDebounce = null;
        [titleInput, contentInput].forEach(function (el) {
          if (el) {
            el.addEventListener('input', function () {
              if (saveDebounce) clearTimeout(saveDebounce);
              saveDebounce = setTimeout(function () { saveEntry(); }, 500);
            });
          }
        });

        // Initialize
        setupLockUI();
      })();
    </script>
  </body>
