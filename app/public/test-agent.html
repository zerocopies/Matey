<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Test</title>
</head>
<body>
  <div id="agent-chat"></div>
  <div class="md-composer" id="md-composer">
    <div class="md-compose-box">
      <textarea class="md-compose-input" id="md-compose-input" autocomplete="off" rows="1">hi agent</textarea>
      <div class="md-compose-actions">
        <button class="md-send-btn" id="md-send" type="button">Send</button>
      </div>
    </div>
  </div>
  
  <!-- Load the same scripts -->
  <script src="./matey-saf.js?v=94"></script>
  <script type="module" src="./matey-agent-bundle.js?v=94"></script>
  <script src="./matey-agent-init.js?v=94"></script>
  
  <script>
  // Auto-send a message after scripts load
  setTimeout(function() {
    var input = document.getElementById('md-compose-input');
    var sendBtn = document.getElementById('md-send');
    if (input && sendBtn) {
      input.value = 'hi agent';
      // Trigger input event
      var evt = new Event('input', { bubbles: true });
      input.dispatchEvent(evt);
      // Click send
      sendBtn.click();
      console.log('Test: Auto-sent message');
    } else {
      console.error('Test: Could not find input or send button');
    }
  }, 3000);
  
  // Log all console messages
  window.onerror = function(msg, url, line, col, err) {
    console.error('GLOBAL ERROR:', msg, 'at', url + ':' + line);
  };
  </script>
</body>
</html>
